# Contrato canónico BSCN. Instalar/adaptar no virtual host produtivo.
# O certificado indicado tem de incluir bscn.pt e www.bscn.pt.

server {
    listen 80;
    server_name bscn.pt www.bscn.pt;
    return 301 https://bscn.pt$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.bscn.pt;

    ssl_certificate /etc/letsencrypt/live/bscn.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bscn.pt/privkey.pem;

    return 301 https://bscn.pt$request_uri;
}

# O bloco HTTPS principal existente deve manter apenas:
# server_name bscn.pt;
# e continuar a servir /var/www/clubmanager/public através de PHP-FPM.
