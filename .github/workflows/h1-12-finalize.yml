# One-shot H1.12 finalizer; self-removes after successful commit.
name: H1.12 finalize ratchet and docs

on:
  push:
    branches:
      - cleanup/h1-12-typescript-faturas
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: h1-12-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/h1-12-typescript-faturas
          fetch-depth: 0

      - name: Tighten TypeScript ratchet and update H1 documentation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          baseline_path = Path('qa/baselines/typescript.json')
          baseline = json.loads(baseline_path.read_text())
          baseline['max_errors'] = 16
          baseline['max_affected_files'] = 1
          baseline_path.write_text(json.dumps(baseline, indent=2, ensure_ascii=False) + '\n')

          qa_path = Path('docs/qa/H1_BASELINE.md')
          qa = qa_path.read_text()
          h111 = "- H1.11: 25 erros / 4 ficheiros → 22 erros / 2 ficheiros. O Portal passou a ter filtro funcional por categoria, lista de comunicações recentes e abertura coerente de cada item, marcando-o como lido antes de seguir para o link associado ou para o detalhe da caixa de entrada. Em `Financeiro/request.ts`, o body do `fetch` passou a preservar diretamente o narrowing de `FormData`, sem alterar payloads, endpoints ou regras financeiras. A execução diagnóstica da PR #218 confirmou exatamente 22 erros em 2 ficheiros, sem qualquer residual em Portal ou `Financeiro/request.ts`.\n"
          h112 = h111 + "- H1.12: 22 erros / 2 ficheiros → 16 erros / 1 ficheiro. `Financeiro/FaturasTab.tsx` passou a usar o helper financeiro canónico `getFinanceiroAxiosJsonConfig` nas três chamadas residuais e os payloads manuais usam o `user_id` já validado pelo guard do formulário; uma fatura histórica sem titular é normalizada para valor vazio e continua impedida de persistir até existir utilizador. A CI #817 confirmou Faturas sem diagnósticos, 1764 testes / 9860 assertions, legacy-read guard e PostgreSQL concurrency verdes. Resta apenas `Financeiro/BancoTab.tsx` com 16 diagnósticos.\n"
          qa = replace_once(qa, h111, h112, 'qa H1.12 evolution')
          qa = replace_once(qa, '- máximo 22 erros;\n- máximo 2 ficheiros afetados.', '- máximo 16 erros;\n- máximo 1 ficheiro afetado.', 'qa ceiling')
          qa = replace_once(qa, '1. Fechar os 22 erros TypeScript restantes nos dois fluxos financeiros dedicados: `Financeiro/FaturasTab.tsx` mantém 6 erros e deve ser tratado primeiro por ter menor superfície; `Financeiro/BancoTab.tsx` mantém 16 e continua reservado a lote próprio por ser o fluxo de maior criticidade.', '1. Fechar os 16 erros TypeScript restantes em `Financeiro/BancoTab.tsx` num lote financeiro final e isolado, preservando as invariantes de reconciliação e pagamento.', 'qa pending')
          qa_path.write_text(qa)

          live_path = Path('docs/ESTADO_VIVO_DESENVOLVIMENTO.md')
          live = live_path.read_text()
          live = replace_once(live, '| Base técnica / arquitetura | 89% | H0.1a/H0.1b/H0.2 concluídos em produção. H1.1 concluiu dependency remediation compatível e QA ratchets; H1.4/H1.5/H1.6/H1.7/H1.8/H1.9 reduziram progressivamente a dívida TypeScript para 36 erros/10 ficheiros. Permanecem Laravel major, migração de `xlsx`, continuação do paydown TypeScript e hardenings residuais. |', '| Base técnica / arquitetura | 89% | H0.1a/H0.1b/H0.2 concluídos em produção. H1.1 concluiu dependency remediation compatível e QA ratchets; H1.4–H1.12 reduziram progressivamente a dívida TypeScript para 16 erros/1 ficheiro. Permanecem o lote final isolado de Banco, Laravel major, migração de `xlsx` e hardenings residuais. |', 'live base grid')
          live = replace_once(live, '| PWA / Mobile | 55% | H1.4/H1.5/H1.6/H1.7/H1.8/H1.9 reduziram a dívida TypeScript de 132 erros/55 ficheiros para 36 erros/10 ficheiros e apertaram o ratchet anti-regressão para esse teto. Continuam em falta lint, unit/component tests, E2E, acessibilidade e matriz Android/iOS/tablet/desktop. |', '| PWA / Mobile | 55% | H1.4–H1.12 reduziram a dívida TypeScript de 132 erros/55 ficheiros para 16 erros/1 ficheiro e apertaram sucessivamente o ratchet anti-regressão. Continuam em falta lint, unit/component tests, E2E, acessibilidade e matriz Android/iOS/tablet/desktop. |', 'live pwa grid')
          live = replace_once(live, '- TypeScript começou com teto de 132 erros / 55 ficheiros; qualquer melhoria tem de baixar o baseline no mesmo PR. H1.4 reduziu-o para 123/51, H1.5 para 101/51, H1.6 para 88/44, H1.7 para 66/27, H1.8 para 53/21, H1.9 para 36/10, H1.10 para 25/4 e H1.11 para o teto atual de 22 erros / 2 ficheiros;', '- TypeScript começou com teto de 132 erros / 55 ficheiros; qualquer melhoria tem de baixar o baseline no mesmo PR. H1.4 reduziu-o para 123/51, H1.5 para 101/51, H1.6 para 88/44, H1.7 para 66/27, H1.8 para 53/21, H1.9 para 36/10, H1.10 para 25/4, H1.11 para 22/2 e H1.12 para o teto atual de 16 erros / 1 ficheiro;', 'live ratchet summary')
          h112_section = """### H1.12 — Fecho TypeScript de Faturas — PR #219

Nono lote mensurável, focado exclusivamente no fluxo financeiro de Faturas e mantendo Banco fora do lote:

- três chamadas locais ao helper antigo `getAxiosJsonConfig` passaram a usar o helper financeiro canónico `getFinanceiroAxiosJsonConfig`, já importado e utilizado pelo módulo;
- os dois payloads de persistência manual usam `formData.user_id` depois do guard explícito que impede gravação sem utilizador;
- ao editar uma fatura histórica sem titular, o formulário normaliza `user_id` nulo para vazio e mantém o mesmo bloqueio antes de qualquer persistência;
- `tsc --noEmit` passou de 22 erros / 2 ficheiros para 16 erros / 1 ficheiro;
- `Financeiro/FaturasTab.tsx` ficou sem diagnósticos; permanecem apenas os 16 de `Financeiro/BancoTab.tsx`, reservado ao lote financeiro final;
- CI #817 validou o código com build Vite, 1764 testes / 9860 assertions, legacy-read guard e PostgreSQL concurrency verdes;
- sem migrations, sem alterações de dados, sem novos endpoints e sem alteração das regras financeiras.

"""
          live = replace_once(live, 'Pendências H1 separadas:\n', h112_section + 'Pendências H1 separadas:\n', 'live H1.12 section')
          live = replace_once(live, '3. fechar os 22 erros TypeScript restantes em dois lotes financeiros dedicados: `Financeiro/FaturasTab.tsx` (6) primeiro e `Financeiro/BancoTab.tsx` (16) depois;', '3. fechar os 16 erros TypeScript restantes em `Financeiro/BancoTab.tsx` num lote financeiro final e isolado;', 'live pending TS')
          live = replace_once(live, '| 1 | H1 | H1.1, H1.4, H1.5, H1.6, H1.7, H1.8, H1.9, H1.10 e H1.11 concluídos/validados por lotes; fechar os dois residuais financeiros TypeScript e avançar com Laravel major, migração de `xlsx`, hardening residual R2 e QA frontend. |', '| 1 | H1 | H1.1, H1.4–H1.12 concluídos/validados por lotes; fechar o residual TypeScript final de `BancoTab.tsx` em isolamento e avançar com Laravel major, migração de `xlsx`, hardening residual R2 e QA frontend. |', 'live priority')
          live = replace_once(live, 'Próximo passo: continuar H1 a partir do teto 22/2. Tratar primeiro `Financeiro/FaturasTab.tsx` (6 erros), cuja superfície é menor e já tem contract tests dedicados, e só depois `Financeiro/BancoTab.tsx` (16 erros) num lote financeiro isolado. Em paralelo, preparar Laravel major e a migração de `xlsx` sem degradar o runtime atual.', 'Próximo passo: continuar H1 a partir do teto 16/1. Tratar `Financeiro/BancoTab.tsx` (16 erros) num lote financeiro final e isolado, preservando explicitamente as invariantes de reconciliação, alocação e pagamento. Em paralelo, preparar Laravel major e a migração de `xlsx` sem degradar o runtime atual.', 'live next step')
          history_header = '| Data | Módulo | Desenvolvimento / análise | Evidência | Estado / pendências |\n|---|---|---|---|---|\n'
          history_row = '| 2026-08-24 | QA / TypeScript / Faturas | H1.12 fechou os 6 diagnósticos de `FaturasTab.tsx`, substituindo helpers residuais e alinhando `user_id` com o guard já existente, reduzindo a dívida de 22 erros/2 ficheiros para 16 erros/1 ficheiro sem tocar em Banco. | PR #219; CI #817; `qa/baselines/typescript.json`; `docs/qa/H1_BASELINE.md` | Novo teto 16/1. Resta apenas `BancoTab.tsx` com 16 diagnósticos para lote financeiro isolado. |\n'
          live = replace_once(live, history_header, history_header + history_row, 'live history')
          live_path.write_text(live)
          PY

      - name: Commit final H1.12 state
        shell: bash
        run: |
          git rm .github/workflows/h1-12-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/baselines/typescript.json docs/qa/H1_BASELINE.md docs/ESTADO_VIVO_DESENVOLVIMENTO.md
          git diff --cached --check
          git commit -m 'docs(qa): record H1.12 TypeScript ceiling'
          git push origin HEAD:cleanup/h1-12-typescript-faturas
