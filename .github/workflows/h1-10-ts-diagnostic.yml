name: H1.10 TypeScript diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/js/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/h1-10-ts-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Full TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false
          exit 0
