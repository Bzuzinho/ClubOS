name: H1.14 finalize documentation

on:
  push:
    branches:
      - chore/h1-14-laravel-supported-major-readiness

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/h1-14-laravel-supported-major-readiness
      - name: Update H1.14 source of truth
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          estado = Path('docs/ESTADO_VIVO_DESENVOLVIMENTO.md')
          text = estado.read_text()

          replacements = {
              'Stack produtiva: Laravel 11, PHP 8.3, React 19 + TypeScript, Inertia, Vite, PostgreSQL 17 local na Oracle VM, Redis, GitHub Actions, Nginx e PHP-FPM.':
              'Stack produtiva: Laravel 13, PHP 8.3, React 19 + TypeScript, Inertia 2, Vite, PostgreSQL 17 local na Oracle VM, Redis, GitHub Actions, Nginx e PHP-FPM.',
              'H1.1 concluiu dependency remediation compatível e QA ratchets; H1.4–H1.13 eliminaram progressivamente a dívida TypeScript, agora em 0 erros/0 ficheiros com ratchet bloqueado em zero. Permanecem Laravel major, migração de `xlsx` e hardenings residuais.':
              'H1.1 concluiu dependency remediation compatível e QA ratchets; H1.4–H1.13 eliminaram progressivamente a dívida TypeScript, agora em 0 erros/0 ficheiros com ratchet bloqueado em zero. H1.14 elevou o backend de Laravel 11 para Laravel 13, eliminando os 3 advisories Composer e preservando UUIDv4. Permanecem a migração de `xlsx` e hardenings residuais.',
              'Baseline Composer registado durante H0.1: 34 advisories em 12 packages, sem `critical`. H1.1 demonstrou remediação compatível para 3 advisories residuais, todos em `laravel/framework` 11; a eliminação total requer upgrade major planeado.':
              'Baseline Composer registado durante H0.1: 34 advisories em 12 packages, sem `critical`. H1.1 reduziu-o para 3 advisories residuais em `laravel/framework` 11; H1.14 concluiu o upgrade para Laravel 13 e reduziu o baseline Composer para 0 advisories.',
              '- Composer aceita temporariamente apenas o residual Laravel 11, limitado a 3 advisories, 0 critical e no máximo 1 high;':
              '- Composer passou em H1.14 para baseline estrito de 0 advisories; qualquer advisory novo falha o CI;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'ESTADO_VIVO expected text not found: {old[:80]}')
              text = text.replace(old, new, 1)

          section = '''\n### H1.14 — Upgrade para Laravel 13 suportado — PR #222\n\nObjetivo: eliminar a dívida de segurança residual do Laravel 11 sem alterar contratos funcionais nem introduzir mudanças silenciosas de identificadores.\n\nImplementado:\n\n- `laravel/framework` 11 → 13, mantendo PHP 8.3;\n- `inertiajs/inertia-laravel` atualizado para a linha 2.x compatível com Laravel 13, mantendo o protocolo/client Inertia atual;\n- `laravel/sanctum`, `laravel/tinker`, `laravel/breeze`, `nunomaduro/collision` e PHPUnit atualizados para versões compatíveis;\n- os 186 modelos que usavam `HasUuids` passam a usar `HasVersion4Uuids` através de alias local, preservando explicitamente a geração UUIDv4 apesar da mudança de default do framework;\n- 12 testes legacy `@test` migrados para atributos `#[Test]` compatíveis com PHPUnit 12;\n- regression test permanente garante que novos IDs continuam UUIDv4;\n- removido o `post-update-cmd` órfão de `laravel-assets`; package discovery continua validado por `post-autoload-dump` e pela instalação limpa;\n- ratchet Composer apertado de 3 advisories residuais para 0 advisories.\n\nMatriz materializada e validada:\n\n- Laravel 13.29.0;\n- Inertia Laravel 2.0.25;\n- Sanctum 4.3.3;\n- Tinker 3.0.2;\n- Breeze 2.4.2;\n- Collision 8.9.5;\n- PHPUnit 12.5.33;\n- Composer audit: 0 advisories;\n- instalação Composer limpa, Vite build e suite Laravel executados no estado final transformado;\n- sem migrations, sem alterações de dados e sem alterações de regras de negócio.\n\nA PR #222 é o gate canónico de integração, incluindo CI transversal e PostgreSQL antes de merge/deploy.\n'''
          marker = '\n## 6.'
          if marker not in text:
              raise SystemExit('ESTADO_VIVO marker ## 6. not found')
          if '### H1.14 — Upgrade para Laravel 13 suportado' not in text:
              text = text.replace(marker, section + marker, 1)
          estado.write_text(text)

          baseline = Path('docs/qa/H1_BASELINE.md')
          text = baseline.read_text()
          text = text.replace('Data de referência: 2026-08-22.', 'Data de referência: 2026-08-26.')

          old_composer = '''### Composer\n\nO CI aceita temporariamente no máximo:\n\n- 3 advisories no total;\n- todos exclusivamente em `laravel/framework`;\n- 0 critical;\n- no máximo 1 high.\n\nQualquer advisory noutro pacote, novo critical ou crescimento acima deste baseline falha o CI.\n\nA eliminação integral do residual Laravel exige uma migração planeada para Laravel 12+ e não é misturada com este lote de patches/minors.\n'''
          new_composer = '''### Composer\n\nH1.14 concluiu a migração do framework para Laravel 13 e eliminou o residual aceite em H1.1. O CI permite agora:\n\n- 0 advisories no total;\n- 0 critical;\n- 0 high.\n\nQualquer advisory Composer novo falha o CI. Não existe exceção residual para `laravel/framework`.\n'''
          if old_composer not in text:
              raise SystemExit('H1_BASELINE Composer block not found')
          text = text.replace(old_composer, new_composer, 1)

          old_pending = '''1. Planear Laravel 12+ para remover os 3 advisories residuais do framework.\n2. Substituir/migrar `xlsx` preservando o importador de membros.\n3. Reduzir o token R2 para `Object Read & Write` limitado ao bucket de backup e confirmar Bucket Lock.\n4. Evoluir QA frontend com lint, unit/component tests, E2E, acessibilidade e matriz mobile/desktop.'''
          new_pending = '''1. Substituir/migrar `xlsx` preservando o importador de membros.\n2. Reduzir o token R2 para `Object Read & Write` limitado ao bucket de backup e confirmar Bucket Lock.\n3. Evoluir QA frontend com lint, unit/component tests, E2E, acessibilidade e matriz mobile/desktop.'''
          if old_pending not in text:
              raise SystemExit('H1_BASELINE pending block not found')
          text = text.replace(old_pending, new_pending, 1)

          h114 = '''\n## H1.14 — Laravel supported major\n\nUpgrade materializado de Laravel 11 para Laravel 13:\n\n- Laravel 13.29.0 e PHP 8.3;\n- Inertia Laravel 2.0.25, mantendo protocolo Inertia 2;\n- Sanctum 4.3.3, Tinker 3.0.2, Breeze 2.4.2, Collision 8.9.5 e PHPUnit 12.5.33;\n- Composer: 3 advisories residuais → 0;\n- 186 modelos preservam explicitamente UUIDv4 com `HasVersion4Uuids`;\n- 12 testes legacy migrados de `@test` para `#[Test]`;\n- regression test dedicado protege a semântica UUIDv4;\n- `post-update-cmd` órfão de `laravel-assets` removido; instalação limpa e package discovery continuam gates obrigatórios.\n\nQualquer regressão futura de advisories Composer falha o CI.\n'''
          if '## H1.14 — Laravel supported major' not in text:
              marker = '\n## Pendências H1\n'
              if marker not in text:
                  raise SystemExit('H1_BASELINE Pendências marker not found')
              text = text.replace(marker, h114 + marker, 1)
          baseline.write_text(text)
          PY

          git diff --check

      - name: Commit docs and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/h1-14-finalize-docs.yml
          git add docs/ESTADO_VIVO_DESENVOLVIMENTO.md docs/qa/H1_BASELINE.md
          git diff --cached --check
          git config user.name 'Bzuzinho'
          git config user.email 'ricardo.jgvf@gmail.com'
          git commit -m 'docs(h1.14): record Laravel 13 supported baseline'
          git push origin HEAD:chore/h1-14-laravel-supported-major-readiness
