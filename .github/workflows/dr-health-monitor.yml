name: DR Health Monitor

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  VM_USER: ${{ secrets.ORACLE_VM_USER }}
  VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
  VM_APP_DIR: ${{ secrets.ORACLE_VM_APP_DIR }}
  VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}

jobs:
  check-production-dr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate configuration
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          for variable in VM_USER VM_HOST VM_APP_DIR VM_KNOWN_HOSTS ORACLE_VM_SSH_KEY; do
            [[ -n "${!variable:-}" ]] || { echo "::error::Missing ${variable}"; exit 1; }
          done

      - name: Configure pinned SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_VM_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${VM_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"
          ssh-keygen -F "${VM_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Check production DR health
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/dr-health.txt"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "sudo bash '${VM_APP_DIR}/scripts/ops/dr/check-dr-health.sh'" \
            | tee "${report}"

          {
            echo '## ClubOS Disaster Recovery health'
            echo ''
            echo '```text'
            cat "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
