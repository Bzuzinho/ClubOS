name: H1.8 TypeScript Patcher

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'cleanup/h1-8-typescript-low-risk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply H1.8 type-only patch and measure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          def replace_once(path_str: str, before: str, after: str) -> None:
              path = Path(path_str)
              text = path.read_text()
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected exactly one occurrence of {before!r}, found {count}')
              path.write_text(text.replace(before, after, 1))

          def strip_reload_options(path_str: str, expected_removed: int) -> None:
              path = Path(path_str)
              lines = path.read_text().splitlines(keepends=True)
              output = []
              inside_reload = False
              removed = 0
              for line in lines:
                  if 'router.reload({' in line:
                      inside_reload = True
                  if inside_reload and line.strip() in {'preserveState: true,', 'preserveScroll: true,'}:
                      removed += 1
                      continue
                  output.append(line)
                  if inside_reload and line.strip() == '});':
                      inside_reload = False
              if removed != expected_removed:
                  raise SystemExit(f'{path_str}: expected {expected_removed} redundant reload option line(s), removed {removed}')
              path.write_text(''.join(output))

          replace_once(
              'resources/js/Pages/Comunicacao/Index.tsx',
              "const userTypeLabel = (value: string) => value.replaceAll('_', ' ');",
              "const userTypeLabel = (value: string) => value.split('_').join(' ');",
          )
          replace_once(
              'resources/js/components/sports/cais/CaisContextPanel.tsx',
              "item.type.replaceAll('_', ' ')",
              "item.type.split('_').join(' ')",
          )
          replace_once(
              'resources/js/Pages/Membros/Show.tsx',
              '        setActiveTab(value);',
              '        setActiveTab(value as MemberTab);',
          )
          replace_once(
              'resources/js/Pages/Comunicacao/Index.tsx',
              '    const sections = [\n      {\n        key: \'agendados\',',
              "    const sections: Array<{\n      key: string;\n      title: string;\n      description: string;\n      statuses: CampaignStatus[];\n      badgeVariant: 'outline' | 'secondary' | 'default' | 'destructive';\n      items: typeof campaignsData;\n    }> = [\n      {\n        key: 'agendados',",
          )

          strip_reload_options('resources/js/Pages/Comunicacao/Index.tsx', 6)
          strip_reload_options('resources/js/Pages/Configuracoes/Index.tsx', 2)
          strip_reload_options('resources/js/Pages/Financeiro/FaturasTab.tsx', 1)
          strip_reload_options('resources/js/Pages/Financeiro/FiscalDocumentsTab.tsx', 2)
          strip_reload_options('resources/js/Pages/Financeiro/MovimentosTab.tsx', 1)
          strip_reload_options('resources/js/Pages/Financeiro/ReceiptImportsTab.tsx', 1)
          strip_reload_options('resources/js/Pages/Membros/Show.tsx', 2)

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if 'resources/js/Pages/Financeiro/BancoTab.tsx' in changed:
              raise SystemExit('H1.8 must not modify Financeiro/BancoTab.tsx')

          result = subprocess.run(
              ['npx', 'tsc', '--noEmit', '--pretty', 'false'],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          print(result.stdout)
          diagnostic_re = re.compile(r'^(.+?)\(\d+,\d+\): error TS\d+:')
          error_files = []
          banco_errors = 0
          for line in result.stdout.splitlines():
              match = diagnostic_re.match(line)
              if not match:
                  continue
              filename = match.group(1)
              error_files.append(filename)
              if filename == 'resources/js/Pages/Financeiro/BancoTab.tsx':
                  banco_errors += 1

          error_count = len(error_files)
          affected_count = len(set(error_files))
          print(f'H1.8 measured TypeScript: {error_count} error(s) / {affected_count} file(s); BancoTab={banco_errors}')
          if (error_count, affected_count) != (53, 21):
              raise SystemExit(f'unexpected H1.8 TypeScript result: {error_count}/{affected_count}, expected 53/21')
          if banco_errors != 16:
              raise SystemExit(f'BancoTab error count changed unexpectedly: {banco_errors}, expected 16')

          baseline_path = Path('qa/baselines/typescript.json')
          baseline = json.loads(baseline_path.read_text())
          if baseline.get('contract') != 'clubos-typescript-baseline-v1':
              raise SystemExit('unexpected TypeScript baseline contract')
          if (baseline.get('max_errors'), baseline.get('max_affected_files')) != (66, 27):
              raise SystemExit(f'unexpected starting TypeScript baseline: {baseline}')
          baseline['max_errors'] = error_count
          baseline['max_affected_files'] = affected_count
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n')
          PY

      - name: Remove temporary H1.8 workflows
        shell: bash
        run: |
          git rm -f .github/workflows/h1-8-typescript-diagnostic.yml
          git rm -f .github/workflows/h1-8-typescript-patcher.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/Pages/Comunicacao/Index.tsx \
                  resources/js/Pages/Configuracoes/Index.tsx \
                  resources/js/Pages/Financeiro/FaturasTab.tsx \
                  resources/js/Pages/Financeiro/FiscalDocumentsTab.tsx \
                  resources/js/Pages/Financeiro/MovimentosTab.tsx \
                  resources/js/Pages/Financeiro/ReceiptImportsTab.tsx \
                  resources/js/Pages/Membros/Show.tsx \
                  resources/js/components/sports/cais/CaisContextPanel.tsx \
                  qa/baselines/typescript.json \
                  .github/workflows
          git diff --cached --check
          git commit -m 'fix(types): normalizar reload Inertia e compatibilidade ES2020'
          git push origin HEAD:${{ github.head_ref }}
