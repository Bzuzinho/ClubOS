name: H1.7 Living Doc Patcher

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'cleanup/h1-7-inertia-pageprops-contract'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update living document
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ESTADO_VIVO_DESENVOLVIMENTO.md')
          text = path.read_text()

          replacements = [
              (
                  'H1.4/H1.5/H1.6 reduziram progressivamente a dívida TypeScript para 88 erros/44 ficheiros.',
                  'H1.4/H1.5/H1.6/H1.7 reduziram progressivamente a dívida TypeScript para 66 erros/27 ficheiros.'
              ),
              (
                  'H1.4/H1.5/H1.6 reduziram a dívida TypeScript de 132 erros/55 ficheiros para 88 erros/44 ficheiros e apertaram o ratchet anti-regressão para esse teto.',
                  'H1.4/H1.5/H1.6/H1.7 reduziram a dívida TypeScript de 132 erros/55 ficheiros para 66 erros/27 ficheiros e apertaram o ratchet anti-regressão para esse teto.'
              ),
              (
                  'H1.4 reduziu-o para 123/51, H1.5 para 101/51 e H1.6 para o teto atual de 88 erros / 44 ficheiros;',
                  'H1.4 reduziu-o para 123/51, H1.5 para 101/51, H1.6 para 88/44 e H1.7 para o teto atual de 66 erros / 27 ficheiros;'
              ),
              (
                  '### H1.6 — Dead code TypeScript guiado por concentração — PR #213',
                  '### H1.6 — Dead code TypeScript guiado por concentração — validada na CI #756 / PR #213'
              ),
              (
                  '3. continuar o paydown dos 88 erros TypeScript por domínio; o maior ficheiro isolado é `Financeiro/BancoTab.tsx`, que deve ser tratado num lote próprio por ser fluxo financeiro crítico;',
                  '3. continuar o paydown dos 66 erros TypeScript por domínio; o maior ficheiro isolado é `Financeiro/BancoTab.tsx` com 16 erros, que deve ser tratado num lote próprio por ser fluxo financeiro crítico;'
              ),
              (
                  'H1.1, H1.4, H1.5 e H1.6 concluídos/validados por lotes;',
                  'H1.1, H1.4, H1.5, H1.6 e H1.7 concluídos/validados por lotes;'
              ),
              (
                  'reduzindo a dívida TypeScript a partir do teto 88/44',
                  'reduzindo a dívida TypeScript a partir do teto 66/27'
              ),
              (
                  'baseline TS inicial 132/55, já reduzido por H1.6 para 88/44.',
                  'baseline TS inicial 132/55, já reduzido por H1.7 para 66/27.'
              ),
          ]

          for before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, found {count}: {before}')
              text = text.replace(before, after)

          anchor = '''- sem alteração de runtime funcional, migrations ou dados; build e PostgreSQL concurrency foram validados durante a medição, ficando a CI final limpa da PR como gate antes do merge.\n\nPendências H1 separadas:'''
          insert = '''- sem alteração de runtime funcional, migrations ou dados; build e PostgreSQL concurrency foram validados durante a medição, ficando a CI final limpa da PR como gate antes do merge.\n\n### H1.7 — Normalização do contrato Inertia PageProps — validada na CI #760 / PR #214\n\nQuarto lote mensurável, dirigido ao maior padrão transversal remanescente (`TS2344`):\n\n- o helper `PageProps<T>` deixou de exigir que todas as interfaces de página declarem uma index signature artificial, mantendo `Record<string, unknown>` apenas no contrato efetivo entregue ao `usePage`;\n- seis `usePage` locais com interfaces próprias passaram a declarar explicitamente a compatibilidade com o contrato Inertia sem alterar props, dados ou comportamento runtime;\n- foram eliminados os 22 diagnósticos `TS2344` medidos na H1.6;\n- `tsc --noEmit` passou de 88 erros / 44 ficheiros para 66 erros / 27 ficheiros;\n- `qa/baselines/typescript.json` foi reduzido para `66 / 27` no mesmo lote;\n- CI #760 verde no código: Composer/npm ratchets, TypeScript 66/27, build Vite, 1764 testes / 9860 assertions, legacy members guard e PostgreSQL concurrency.\n\nPendências H1 separadas:'''
          if text.count(anchor) != 1:
              raise SystemExit('H1.6 insertion anchor not found exactly once')
          text = text.replace(anchor, insert)

          history_anchor = '''|---|---|---|---|---|\n| 2026-08-23 | QA / TypeScript / Dead code |'''
          history_insert = '''|---|---|---|---|---|\n| 2026-08-24 | QA / TypeScript / Inertia | H1.7 normalizou o contrato `PageProps`/`usePage` sem alterar runtime e eliminou todos os 22 `TS2344`, reduzindo a dívida TypeScript de 88 erros/44 ficheiros para 66 erros/27 ficheiros. | PR #214; CI #760; `resources/js/types/index.d.ts`; `qa/baselines/typescript.json`; `docs/qa/H1_BASELINE.md` | Novo teto 66/27. Próximos lotes devem preservar a separação do Financeiro crítico e reduzir novamente o ratchet. |\n| 2026-08-23 | QA / TypeScript / Dead code |'''
          if text.count(history_anchor) != 1:
              raise SystemExit('history anchor not found exactly once')
          text = text.replace(history_anchor, history_insert)

          path.write_text(text)
          PY

      - name: Commit documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ESTADO_VIVO_DESENVOLVIMENTO.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: registar H1.7 no estado vivo'
          git push origin HEAD:${{ github.head_ref }}
