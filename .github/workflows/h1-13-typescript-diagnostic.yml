name: H1.13 TypeScript diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  banco-typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print BancoTab diagnostics only
        shell: bash
        run: |
          set +e
          OUTPUT="$(npx tsc --noEmit --pretty false 2>&1)"
          printf '%s\n' "$OUTPUT" | grep 'resources/js/Pages/Financeiro/BancoTab.tsx' || true
          COUNT="$(printf '%s\n' "$OUTPUT" | grep -c 'resources/js/Pages/Financeiro/BancoTab.tsx.*error TS' || true)"
          echo "BANCO_TS_ERROR_COUNT=$COUNT"
          exit 0
