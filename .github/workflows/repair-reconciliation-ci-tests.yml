name: Repair reconciliation CI tests

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/reconciliation-ci-expectations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reconciliation-ci-expectations
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Restore ambiguity safety expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/Feature/Financeiro/BankReconciliationSuggestionFlowTest.php')
          text = path.read_text()

          old_assertion = "$this->assertTrue((bool) $suggestion['is_directly_reconcilable']);"
          new_assertion = "$this->assertFalse((bool) $suggestion['is_directly_reconcilable']);"
          count = text.count(old_assertion)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 incorrect assertions, found {count}')
          text = text.replace(old_assertion, new_assertion)

          renames = {
              'test_equal_invoice_and_billed_movement_require_assisted_choice':
                  'test_equal_invoice_and_billed_movement_remain_non_direct_for_operator_review',
              'test_multiple_equal_expenses_never_expose_direct_reconciliation':
                  'test_multiple_equal_expenses_remain_non_direct_for_operator_review',
          }
          for old, new in renames.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one test name {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/Feature/Financeiro/BankReconciliationSuggestionFlowTest.php
          git commit -m 'Clarify non-direct reconciliation ambiguity tests'
          git push origin HEAD:fix/reconciliation-ci-expectations
