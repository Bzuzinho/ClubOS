name: Refresh Browserslist Lock

on:
  push:
    branches:
      - feat/h3e-competitions-results-canonical-contract

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/h3e-competitions-results-canonical-contract
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm audit fix --package-lock-only --ignore-scripts
      - run: node scripts/qa/npm-audit-ratchet.mjs
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already secure"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): patch browserslist security advisories"
          git push origin HEAD:feat/h3e-competitions-results-canonical-contract
