name: H1.9 finalize docs

on:
  push:
    branches:
      - cleanup/h1-9-typescript-domain-cleanup

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/h1-9-typescript-domain-cleanup
          fetch-depth: 0
      - name: Patch living documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ESTADO_VIVO_DESENVOLVIMENTO.md')
          text = path.read_text()

          replacements = {
            'H1.4/H1.5/H1.6/H1.7/H1.8 reduziram progressivamente a dívida TypeScript para 53 erros/21 ficheiros.': 'H1.4/H1.5/H1.6/H1.7/H1.8/H1.9 reduziram progressivamente a dívida TypeScript para 36 erros/10 ficheiros.',
            'H1.4/H1.5/H1.6/H1.7/H1.8 reduziram a dívida TypeScript de 132 erros/55 ficheiros para 53 erros/21 ficheiros e apertaram o ratchet anti-regressão para esse teto.': 'H1.4/H1.5/H1.6/H1.7/H1.8/H1.9 reduziram a dívida TypeScript de 132 erros/55 ficheiros para 36 erros/10 ficheiros e apertaram o ratchet anti-regressão para esse teto.',
            'H1.7 para 66/27 e H1.8 para o teto atual de 53 erros / 21 ficheiros;': 'H1.7 para 66/27, H1.8 para 53/21 e H1.9 para o teto atual de 36 erros / 10 ficheiros;',
            '3. continuar o paydown dos 53 erros TypeScript por domínio; o maior ficheiro isolado é `Financeiro/BancoTab.tsx` com 16 erros, que deve ser tratado num lote próprio por ser fluxo financeiro crítico;': '3. continuar o paydown dos 36 erros TypeScript por domínio; `Financeiro/BancoTab.tsx` mantém 16 erros e fica reservado a lote próprio por ser fluxo financeiro crítico; `Configuracoes/Index.tsx` e `Financeiro/FaturasTab.tsx` concentram 6 erros cada;',
            '| 1 | H1 | H1.1, H1.4, H1.5, H1.6, H1.7 e H1.8 concluídos/validados por lotes; continuar paydown TypeScript e avançar com Laravel major, migração de `xlsx`, hardening residual R2 e QA frontend. |': '| 1 | H1 | H1.1, H1.4, H1.5, H1.6, H1.7, H1.8 e H1.9 concluídos/validados por lotes; continuar paydown TypeScript e avançar com Laravel major, migração de `xlsx`, hardening residual R2 e QA frontend. |',
            'Próximo passo: continuar H1 por lotes pequenos e mensuráveis, reduzindo a dívida TypeScript a partir do teto 53/21 e mantendo os ratchets de segurança; em paralelo, preparar as mudanças incompatíveis de Laravel e `xlsx` sem degradar o runtime atual.': 'Próximo passo: continuar H1 por lotes pequenos e mensuráveis, reduzindo a dívida TypeScript a partir do teto 36/10 e mantendo `Financeiro/BancoTab.tsx` isolado para tratamento financeiro dedicado; em paralelo, preparar as mudanças incompatíveis de Laravel e `xlsx` sem degradar o runtime atual.',
            'baseline TS inicial 132/55, já reduzido por H1.8 para 53/21.': 'baseline TS inicial 132/55, já reduzido por H1.9 para 36/10.'
          }

          for old, new in replacements.items():
              count = text.count(old)
              assert count == 1, f'expected exactly one occurrence, got {count}: {old}'
              text = text.replace(old, new)

          h18_tail = '''- CI #769 integral verde: Composer/npm ratchets, TypeScript 53/21, build Vite, PHPUnit, legacy members read guard e PostgreSQL concurrency.\n\nPendências H1 separadas:'''
          h19 = '''- CI #769 integral verde: Composer/npm ratchets, TypeScript 53/21, build Vite, PHPUnit, legacy members read guard e PostgreSQL concurrency.\n\n### H1.9 — Alinhamento de contratos TypeScript por domínio — validada na CI #790 / PR #216\n\nSexto lote mensurável, focado em contratos locais e partilhados de baixo risco, sem alterar regras de negócio ou o fluxo bancário crítico:\n\n- alinhados tipos opcionais e payloads já existentes em Eventos, Desportivo, Loja, Marketing, Perfil e Portal;\n- normalizado `tempo_oficial` para string no adapter de resultados de competição, preservando o contrato consumido pelo frontend;\n- explicitadas propriedades já consumidas (`attendanceRate`, `epoca_id`, `ordem`) e estados literais sem alterar runtime;\n- `resources/js/Pages/Financeiro/BancoTab.tsx` permaneceu totalmente fora do lote e mantém 16 diagnósticos;\n- `tsc --noEmit` passou de 53 erros / 21 ficheiros para 36 erros / 10 ficheiros;\n- o código foi validado na CI #790 com build Vite, 1764 testes / 9860 assertions, legacy members read guard e PostgreSQL concurrency verdes;\n- `qa/baselines/typescript.json` é apertado para `36 / 10` no fecho da PR para tornar a melhoria irreversível pelo ratchet.\n\nPendências H1 separadas:'''
          count = text.count(h18_tail)
          assert count == 1, f'H1.8 insertion anchor count={count}'
          text = text.replace(h18_tail, h19)

          history_anchor = '| 2026-08-24 | QA / TypeScript / Inertia | H1.8 normalizou'
          idx = text.find(history_anchor)
          assert idx != -1, 'history anchor not found'
          row = '| 2026-08-24 | QA / TypeScript / contratos por domínio | H1.9 alinhou contratos TypeScript de baixo risco em Eventos, Desportivo, Loja, Marketing, Perfil e Portal, reduzindo a dívida de 53 erros/21 ficheiros para 36 erros/10 ficheiros sem tocar no fluxo bancário crítico. | PR #216; CI #790; `qa/baselines/typescript.json`; `docs/qa/H1_BASELINE.md` | Novo teto 36/10. `Financeiro/BancoTab.tsx` mantém 16 diagnósticos e continua reservado a lote próprio. |\n'
          text = text[:idx] + row + text[idx:]

          path.write_text(text)
          PY

          rm .github/workflows/h1-9-finalize-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESTADO_VIVO_DESENVOLVIMENTO.md .github/workflows/h1-9-finalize-docs.yml
          git commit -m "docs: fechar estado vivo H1.9"
          git push origin HEAD:cleanup/h1-9-typescript-domain-cleanup
