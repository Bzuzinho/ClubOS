name: Apply PR84 CI fixes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr84-ci-fixes
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/financeiro-ui-conciliacao
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath
          coverage: none

      - name: Apply fixes
        run: python scripts/fix_pr84_ci.py

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          cat >> .env <<EOF
          DB_CONNECTION=sqlite
          DB_DATABASE=${{ github.workspace }}/database/database.sqlite
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          EOF

      - name: Validate syntax and guard rails
        shell: bash
        run: |
          php -l app/Services/Members/MemberImportService.php
          php artisan members:audit-users-legacy-read --json --fail-on-finding
          php artisan members:audit-users-legacy-field-removal-readiness --json --fail-on-active-legacy-read

      - name: Run affected tests
        run: |
          php artisan test \
            tests/Feature/Financeiro/BankReconciliationSuggestionFlowTest.php \
            tests/Feature/Membros/UsersLegacyFieldRemovalReadinessAuditCommandTest.php \
            tests/Feature/Membros/UsersLegacyReadAuditCommandTest.php \
            tests/Feature/Membros/UsersLegacyReadGuardRailTest.php \
            tests/Feature/Membros/MemberImportCanonicalWriteContractTest.php \
            tests/Feature/Membros/MembrosGlobalSearchAndNifUniquenessTest.php \
            --stop-on-failure

      - name: Commit validated fixes
        shell: bash
        run: |
          rm -f \
            scripts/fix_pr84_ci.py \
            tests/Feature/Diagnostics/Pr84LegacyReadDiagnosticsTest.php \
            .github/workflows/diagnose-pr84.yml
          git config user.name 'ClubOS automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            app/Services/Members/MemberImportService.php \
            tests/Feature/Financeiro/BankReconciliationSuggestionFlowTest.php \
            scripts/fix_pr84_ci.py \
            tests/Feature/Diagnostics/Pr84LegacyReadDiagnosticsTest.php \
            .github/workflows/diagnose-pr84.yml
          git diff --cached --check
          git commit -m 'Fix PR84 CI regressions'
          git push origin HEAD:fix/financeiro-ui-conciliacao
