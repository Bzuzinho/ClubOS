name: H0.1b Production Preflight

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-preflight:
    if: github.head_ref == 'hardening/h0-1b-atomic-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VM_USER: ${{ secrets.ORACLE_VM_USER }}
      VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      VM_APP_DIR: ${{ secrets.ORACLE_VM_APP_DIR }}
      VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Checkout H0.1b
        uses: actions/checkout@v4

      - name: Configure pinned SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          for variable in VM_USER VM_HOST VM_APP_DIR VM_KNOWN_HOSTS ORACLE_VM_SSH_KEY; do
            [[ -n "${!variable:-}" ]] || { echo "::error::Missing ${variable}"; exit 1; }
          done
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_VM_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${VM_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

      - name: Validate current production and filesystem capabilities
        shell: bash
        run: |
          set -euo pipefail
          remote_health="/tmp/clubos-h0-1b-healthcheck-${GITHUB_RUN_ID}.sh"
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            bin/remote-healthcheck.sh \
            "${VM_USER}@${VM_HOST}:${remote_health}"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "APP_DIR='${VM_APP_DIR}' EXPECTED_SHA='${{ github.event.pull_request.base.sha }}' HEALTH_SCRIPT='${remote_health}' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -f "${HEALTH_SCRIPT}"' EXIT

          for command in git composer php curl rsync tar python3 sudo find readlink; do
            command -v "${command}" >/dev/null 2>&1 || { echo "missing command: ${command}" >&2; exit 1; }
          done

          [[ -d "${APP_DIR}/.git" || -L "${APP_DIR}" ]] || { echo "unknown APP_DIR layout" >&2; exit 1; }
          if [[ -d "${APP_DIR}/.git" ]]; then
            [[ -z "$(git -C "${APP_DIR}" status --porcelain)" ]] || { echo "production working tree is dirty" >&2; exit 1; }
          fi

          available_kb="$(df -Pk "${APP_DIR}" | awk 'NR==2 {print $4}')"
          (( available_kb > 2097152 )) || { echo "less than 2 GiB free for release cutover" >&2; exit 1; }

          test_root="/tmp/clubos-renameat2-${$}"
          dir_path="${test_root}.dir"
          link_path="${test_root}.link"
          mkdir -p "${dir_path}"
          ln -s "${dir_path}" "${link_path}"
          python3 - "${dir_path}" "${link_path}" <<'PY'
          import ctypes, os, sys
          libc = ctypes.CDLL(None, use_errno=True)
          renameat2 = getattr(libc, 'renameat2', None)
          if renameat2 is None:
              raise SystemExit('renameat2 unavailable')
          renameat2.argtypes = [ctypes.c_int, ctypes.c_char_p, ctypes.c_int, ctypes.c_char_p, ctypes.c_uint]
          renameat2.restype = ctypes.c_int
          if renameat2(-100, os.fsencode(sys.argv[1]), -100, os.fsencode(sys.argv[2]), 2) != 0:
              err = ctypes.get_errno()
              raise OSError(err, os.strerror(err))
          PY
          rm -rf "${dir_path}" "${link_path}"

          chmod 700 "${HEALTH_SCRIPT}"
          bash "${HEALTH_SCRIPT}" "${APP_DIR}"

          printf 'H0.1b production preflight OK\n'
          printf 'free_kb=%s\n' "${available_kb}"
          printf 'layout=%s\n' "$([[ -L "${APP_DIR}" ]] && echo atomic || echo legacy)"
          REMOTE
