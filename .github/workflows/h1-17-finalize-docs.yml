name: H1.17 finalize QA documentation

on:
  push:
    branches:
      - chore/h1-17-frontend-qa-matrix
    paths:
      - scripts/qa/h1-17-finalize-docs.py
      - .github/workflows/h1-17-finalize-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/h1-17-frontend-qa-matrix

      - name: Patch documentation
        run: python3 scripts/qa/h1-17-finalize-docs.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESTADO_VIVO_DESENVOLVIMENTO.md docs/qa/H1_BASELINE.md docs/qa/FRONTEND_QA_MATRIX.md
          git diff --cached --check
          git commit -m "H1.17 consolidate frontend QA baseline"
          git push origin HEAD:chore/h1-17-frontend-qa-matrix
