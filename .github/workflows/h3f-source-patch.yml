name: Apply H3f Portal Projection Refactor

on:
  push:
    branches:
      - feat/h3f-portal-canonical-projections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/h3f-portal-canonical-projections
      - name: Apply deterministic source refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/Http/Controllers/PortalTrainingController.php')
          text = path.read_text()
          start = text.index('    public function update(')
          marker = '        $payload = match ($action) {'
          end = text.index(marker, start)
          prefix = '''    public function update(
              Request $request,
              string $trainingReference,
              UpdateTrainingAthleteAction $updateTrainingAthlete,
          ): RedirectResponse {
              /** @var User $user */
              $user = $request->user();
              $action = $request->string('action')->trim()->value();
              $trainingAthlete = app(\\App\\Services\\Desportivo\\SportsPortalProjectionService::class)
                  ->trainingAthleteForAction($user, $trainingReference, $action);

          '''
          text = text[:start] + prefix + text[end:]
          start = text.index('    /**\n     * @return Collection<int, TrainingAthlete>\n     */\n    private function trainingRecordsForUser')
          end = text.index('    private function buildSummary', start)
          replacement = '''    /**
           * @return Collection<int, TrainingAthlete>
           */
          private function trainingRecordsForUser(User $user): Collection
          {
              return app(\\App\\Services\\Desportivo\\SportsPortalProjectionService::class)
                  ->trainingRecordsForUser($user);
          }

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('use App\\Models\\Training;\n', '')
          path.write_text(text)

          path = Path('app/Http/Controllers/DashboardController.php')
          text = path.read_text()
          start = text.index('    /**\n     * @return Collection<int, TrainingAthlete>\n     */\n    private function dashboardTrainingRecordsForUser')
          end = text.index('    /**\n     * @return Collection<int, array<string, mixed>>', start)
          replacement = '''    /**
           * @return Collection<int, TrainingAthlete>
           */
          private function dashboardTrainingRecordsForUser(User $user): Collection
          {
              return app(\\App\\Services\\Desportivo\\SportsPortalProjectionService::class)
                  ->trainingRecordsForUser($user);
          }

          '''
          text = text[:start] + replacement + text[end:]
          old = '''            return Result::where('user_id', $user->id)
                          ->with(['prova.competition'])
                          ->latest()
                          ->take(5)
                          ->get()
                          ->map(function (Result $r) {'''
          if old not in text:
              old = """            return Result::where('user_id', $user->id)\n                ->with(['prova.competition'])\n                ->latest()\n                ->take(5)\n                ->get()\n                ->map(function (Result $r) {"""
          new = """            return app(\\App\\Services\\Desportivo\\SportsPortalProjectionService::class)\n                ->resultsForUser($user)\n                ->sortByDesc(fn (Result $result) => $result->created_at?->getTimestamp() ?? 0)\n                ->take(5)\n                ->map(function (Result $r) {"""
          if old not in text:
              raise SystemExit('Dashboard results query not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('app/Http/Controllers/PortalPageController.php')
          text = path.read_text()
          old = """        $results = $user->results()\n            ->with(['prova.competition'])\n            ->get()\n            ->filter(fn (Result $result) => $result->prova !== null && $result->prova->competition !== null)"""
          new = """        $results = app(\\App\\Services\\Desportivo\\SportsPortalProjectionService::class)\n            ->resultsForUser($user)\n            ->filter(fn (Result $result) => $result->prova !== null && $result->prova->competition !== null)"""
          if old not in text:
              raise SystemExit('Portal results query not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit source refactor
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/PortalTrainingController.php app/Http/Controllers/DashboardController.php app/Http/Controllers/PortalPageController.php
          git commit -m "refactor(portal): project canonical sports state without GET writes"
          git push origin HEAD:feat/h3f-portal-canonical-projections
