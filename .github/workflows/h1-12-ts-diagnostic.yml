name: H1.12 TypeScript diagnostic

on:
  push:
    branches:
      - cleanup/h1-12-typescript-faturas
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Show TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/tsc.log
          status=${PIPESTATUS[0]}
          echo "tsc_exit=$status"
          echo "--- FaturasTab diagnostics ---"
          grep -F 'resources/js/Pages/Financeiro/FaturasTab.tsx' /tmp/tsc.log || true
          exit 0
