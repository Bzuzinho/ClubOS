name: H0.1b Healthcheck PR Patcher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/h0-1b-release-healthcheck-cwd'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/h0-1b-release-healthcheck-cwd
          fetch-depth: 0

      - name: Apply hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          remote_path = Path('bin/remote-deploy-backend.sh')
          remote = remote_path.read_text()
          old = '''  pid="$(sudo -u "${RUNTIME_USER}" -H bash -c '\n    cd "$1"\n    php -S "127.0.0.1:$2" -t public vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php >"$3" 2>&1 &\n    echo $!\n  ' _ "${release}" "${port}" "${log_file}")"\n'''
          new = '''  pid="$(sudo -u "${RUNTIME_USER}" -H bash -c '\n    cd "$1/public"\n    php -S "127.0.0.1:$2" "$1/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php" >"$3" 2>&1 &\n    echo $!\n  ' _ "${release}" "${port}" "${log_file}")"\n'''
          if old not in remote:
              raise SystemExit('remote healthcheck launch pattern not found')
          remote_path.write_text(remote.replace(old, new, 1))

          test_path = Path('tests/Unit/Deployment/AtomicReleaseDeploymentContractTest.php')
          test = test_path.read_text()
          contract_marker = '''        self::assertStringContainsString('migrate --force', $remote);\n        self::assertStringNotContainsString('reset --hard origin/main', $remote);\n'''
          contract_replacement = '''        self::assertStringContainsString('migrate --force', $remote);\n        self::assertStringContainsString('cd "$1/public"', $remote);\n        self::assertStringContainsString('"$1/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"', $remote);\n        self::assertStringNotContainsString('php -S "127.0.0.1:$2" -t public', $remote);\n        self::assertStringNotContainsString('reset --hard origin/main', $remote);\n'''
          if contract_marker not in test:
              raise SystemExit('deployment contract marker not found')
          test = test.replace(contract_marker, contract_replacement, 1)

          method_marker = '''    public function test_all_shell_deployment_scripts_have_valid_bash_syntax(): void\n    {\n'''
          smoke_method = r'''    public function test_isolated_release_healthcheck_serves_up_from_public_working_directory(): void
    {
        $socket = stream_socket_server('tcp://127.0.0.1:0', $errno, $error);
        self::assertIsResource($socket, sprintf('Could not reserve local port: %s (%d)', $error, $errno));

        $address = stream_socket_get_name($socket, false);
        fclose($socket);
        self::assertIsString($address);

        $separator = strrpos($address, ':');
        self::assertNotFalse($separator);
        $port = (int) substr($address, $separator + 1);
        self::assertGreaterThan(0, $port);

        $logPath = sys_get_temp_dir().'/clubos-isolated-healthcheck-'.getmypid().'-'.$port.'.log';
        $router = '../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php';
        $process = proc_open(
            [PHP_BINARY, '-S', '127.0.0.1:'.$port, $router],
            [
                0 => ['pipe', 'r'],
                1 => ['file', $logPath, 'a'],
                2 => ['file', $logPath, 'a'],
            ],
            $pipes,
            $this->root.'/public',
        );

        self::assertIsResource($process, 'Could not start isolated PHP server');
        foreach ($pipes as $pipe) {
            if (is_resource($pipe)) {
                fclose($pipe);
            }
        }

        $status = '';
        try {
            for ($attempt = 0; $attempt < 30; $attempt++) {
                $output = [];
                $exitCode = 0;
                exec(
                    'curl --silent --output /dev/null --write-out '.escapeshellarg('%{http_code}')
                    .' --max-time 2 '.escapeshellarg('http://127.0.0.1:'.$port.'/up').' 2>/dev/null',
                    $output,
                    $exitCode,
                );
                $status = trim(implode("\n", $output));

                if ($exitCode === 0 && $status === '200') {
                    break;
                }

                $processStatus = proc_get_status($process);
                if (! $processStatus['running']) {
                    break;
                }

                usleep(200_000);
            }

            $log = is_file($logPath) ? (string) file_get_contents($logPath) : '';
            self::assertSame('200', $status, "Isolated /up healthcheck failed.\n{$log}");
        } finally {
            $processStatus = proc_get_status($process);
            if ($processStatus['running']) {
                proc_terminate($process);
            }
            proc_close($process);
            @unlink($logPath);
        }
    }

'''
          if method_marker not in test:
              raise SystemExit('bash syntax test marker not found')
          test = test.replace(method_marker, smoke_method + method_marker, 1)
          test_path.write_text(test)

          status_path = Path('docs/ESTADO_VIVO_DESENVOLVIMENTO.md')
          status = status_path.read_text()
          status_marker = 'O diagnóstico read-only da VM confirmou que esta estratégia não exige alterar o root do Nginx nem os crons existentes. O primeiro cutover produtivo é o próximo gate da H0.1b.\n'
          status_replacement = 'O diagnóstico read-only da VM confirmou que esta estratégia não exige alterar o root do Nginx nem os crons existentes. O primeiro cutover produtivo de `bcb6422f` foi abortado de forma segura **antes da troca do path**: o servidor PHP interno do healthcheck pré-cutover era iniciado a partir da raiz da release e o router Laravel procurava `index.php` fora de `public/`. Produção permaneceu no layout legado, sem maintenance mode e com `/up = 200`. O hotfix H0.1b.1 passa a arrancar o servidor com working directory `public/` e acrescenta um smoke test PHPUnit real desta sequência antes de novo cutover.\n'
          if status_marker not in status:
              raise SystemExit('live status cutover marker not found')
          status = status.replace(status_marker, status_replacement, 1)
          old_row = '| 2026-08-21 | Infraestrutura / Deploy | H0.1b implementa releases atómicas mantendo `/var/www/clubmanager` como path compatível, estado partilhado, healthchecks pre/pós-cutover e rollback. | `bin/deploy-vm.mjs`, `bin/deploy-vm.sh`, `bin/remote-deploy-backend.sh`, `bin/remote-healthcheck.sh`, `bin/remote-release-rollback.sh`, `tests/Unit/Deployment/AtomicReleaseDeploymentContractTest.php`, `docs/deploy/DEPLOY_WORKFLOW.md`, `docs/OPERACOES_SERVIDOR.md` | CI e primeiro cutover produtivo ainda por validar; migrations exigem expand/contract. |'
          new_row = '| 2026-08-21 | Infraestrutura / Deploy | H0.1b implementa releases atómicas mantendo `/var/www/clubmanager` como path compatível, estado partilhado, healthchecks pre/pós-cutover e rollback. O primeiro cutover foi recusado antes da troca porque o healthcheck PHP interno arrancava fora de `public/`; H0.1b.1 corrige o CWD e adiciona smoke test PHPUnit real. | `bin/remote-deploy-backend.sh`, `tests/Unit/Deployment/AtomicReleaseDeploymentContractTest.php`, diagnóstico produtivo read-only | Produção manteve layout legado saudável; repetir CI e primeiro cutover após hotfix. |'
          if old_row in status:
              status = status.replace(old_row, new_row, 1)
          status_path.write_text(status)

          deploy_path = Path('docs/deploy/DEPLOY_WORKFLOW.md')
          deploy = deploy_path.read_text()
          deploy_marker = 'A release candidata é validada em `/up` antes de qualquer cutover.'
          if deploy_marker in deploy:
              deploy = deploy.replace(
                  deploy_marker,
                  deploy_marker + ' O servidor PHP interno é iniciado com `public/` como working directory, reproduzindo corretamente o front controller Laravel.',
                  1,
              )
          deploy_path.write_text(deploy)
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/remote-deploy-backend.sh
          php -l tests/Unit/Deployment/AtomicReleaseDeploymentContractTest.php
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force
          php artisan test tests/Unit/Deployment/AtomicReleaseDeploymentContractTest.php

      - name: Commit patched source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bin/remote-deploy-backend.sh tests/Unit/Deployment/AtomicReleaseDeploymentContractTest.php docs/ESTADO_VIVO_DESENVOLVIMENTO.md docs/deploy/DEPLOY_WORKFLOW.md
          git diff --cached --check
          git commit -m 'fix(deploy): corrigir CWD do healthcheck pre-cutover'
          git push origin HEAD:fix/h0-1b-release-healthcheck-cwd
