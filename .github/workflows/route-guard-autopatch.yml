name: Route Guard Autopatch

on:
  push:
    branches:
      - fix/h0-1-access-control-route-guards

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Apply targeted Access Control route patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          web = Path('routes/web.php')
          text = web.read_text()
          start_marker = "    // Settings routes\n"
          end_marker = "    // Sports module routes\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          section = text[start:end]

          if "Route::middleware('module.access:configuracoes')->group(function ()" not in section:
              section = section.replace("->middleware('module.access:configuracoes')\n", "")
              section = re.sub(
                  r"->middleware\(\['module\.access:configuracoes', '([^']+)'\]\)",
                  r"->middleware('\1')",
                  section,
              )
              wrapped = "    Route::middleware('module.access:configuracoes')->group(function () {\n" + section + "    });\n\n"
              text = text[:start] + wrapped + text[end:]

          old_finance = "    // Financial module routes\n    Route::prefix('financeiro')->group(function () {"
          new_finance = "    // Financial module routes\n    Route::prefix('financeiro')->middleware('module.access:financeiro')->group(function () {"
          if old_finance in text:
              text = text.replace(old_finance, new_finance, 1)
          web.write_text(text)

          sports = Path('routes/desportivo_member_contract.php')
          s = sports.read_text()
          s = s.replace(
              "Route::middleware(['web', 'auth', 'verified'])",
              "Route::middleware(['web', 'auth', 'verified', 'module.access:desportivo'])",
          )
          sports.write_text(s)

          medical = Path('routes/member_documents.php')
          s = medical.read_text()
          s = s.replace(
              "Route::middleware(['web', 'auth', 'verified'])",
              "Route::middleware(['web', 'auth', 'verified', 'module.access:membros'])",
          )
          if "permission.access:membros.ficha,edit" not in s:
              s = s.replace(
                  "Route::put('/atestado-medico', [MemberMedicalDocumentController::class, 'update'])\n            ->name",
                  "Route::put('/atestado-medico', [MemberMedicalDocumentController::class, 'update'])\n            ->middleware('permission.access:membros.ficha,edit')\n            ->name",
              )
          medical.write_text(s)

          test = Path('tests/Feature/AccessControl/AccessControlReadinessAuditCommandTest.php')
          s = test.read_text()
          s = s.replace(
              "        $this->assertGreaterThan(0, $payload['summary']['mutating_routes_without_module_guard_count']);\n        $this->assertSame(0, $payload['summary']['mutating_routes_with_module_only_guard_count']);",
              "        $this->assertSame(0, $payload['summary']['mutating_routes_without_module_guard_count']);\n        $this->assertGreaterThan(0, $payload['summary']['mutating_routes_with_module_only_guard_count']);",
          )
          s = s.replace(
              "        $this->assertTrue($codes->contains('mutating_admin_route_without_module_guard'));\n        $this->assertFalse($codes->contains('mutating_admin_route_with_module_only_guard'));",
              "        $this->assertFalse($codes->contains('mutating_admin_route_without_module_guard'));\n        $this->assertTrue($codes->contains('mutating_admin_route_with_module_only_guard'));",
          )
          test.write_text(s)

          status = Path('docs/ESTADO_VIVO_DESENVOLVIMENTO.md')
          s = status.read_text()
          s = s.replace(
              "| Autenticação / Access Control | 75% | Guards e auditoria produtiva existem. Findings críticos passam a ser gate de deploy em H0.1a. Falta matriz formal final de permissões. |",
              "| Autenticação / Access Control | 78% | Guards e auditoria produtiva existem. H0.1a.2 eliminou as 92 rotas mutáveis sem `module.access`; o gate crítico fica alinhado com proteção real de módulo. Permanecem warnings de capability granular em rotas históricas a consolidar. |",
          )
          needle = "- Access Control `critical_count > 0` como falha de deployment.\n"
          note = (
              "- Access Control `critical_count > 0` como falha de deployment.\n\n"
              "O diagnóstico produtivo H0.1a.2 classificou os 92 críticos: todos eram `mutating_admin_route_without_module_guard` — 57 em Configurações, 33 em Financeiro, 1 em Desportivo e 1 em Membros. Foram adicionados guards de módulo às estruturas de rotas afetadas; no atestado médico de membro foi também aplicada a capability `membros.ficha,edit`. Não houve alteração de dados. O auditor passa a exigir zero gaps críticos de módulo; rotas que ainda tenham apenas proteção de módulo ficam como warning e entram na consolidação granular posterior.\n"
          )
          if note not in s:
              s = s.replace(needle, note, 1)
          row = "| 2026-08-21 | Access Control / Rotas | H0.1a.2: diagnóstico read-only em produção confirmou que os 92 findings críticos eram todos rotas administrativas mutáveis sem `module.access` (57 Configurações, 33 Financeiro, 1 Desportivo, 1 Membros). Corrigidos os guards de módulo nas estruturas afetadas; o atestado médico de membro recebe também `permission.access:membros.ficha,edit`; teste da auditoria passa a exigir zero rotas mutáveis sem module guard e a tratar proteção apenas de módulo como warning. | `routes/web.php`, `routes/desportivo_member_contract.php`, `routes/member_documents.php`, `tests/Feature/AccessControl/AccessControlReadinessAuditCommandTest.php`, auditoria produtiva H0.1a.2 | 75% | 78% | Validar CI e novo diagnóstico produtivo: `critical_count=0`. Depois consolidar capabilities granulares das rotas que permaneçam `module_only` como dívida de Access Control, sem voltar a permitir rotas mutáveis apenas com `auth/verified`. |\n"
          if row not in s:
              marker = "| 2026-08-20 | Infraestrutura / CI/CD |"
              idx = s.index(marker)
              line_start = s.rfind('\n', 0, idx) + 1
              s = s[:line_start] + row + s[line_start:]
          status.write_text(s)

          Path('.github/workflows/route-guard-autopatch.yml').unlink()
          PY

      - name: Validate patch syntax
        run: |
          php -l routes/web.php
          php -l routes/desportivo_member_contract.php
          php -l routes/member_documents.php
          php -l tests/Feature/AccessControl/AccessControlReadinessAuditCommandTest.php
          git diff --check

      - name: Commit patch to fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- routes/web.php routes/desportivo_member_contract.php routes/member_documents.php tests/Feature/AccessControl/AccessControlReadinessAuditCommandTest.php docs/ESTADO_VIVO_DESENVOLVIMENTO.md .github/workflows/route-guard-autopatch.yml
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'fix(access): protect mutating admin routes'
          git push origin HEAD:fix/h0-1-access-control-route-guards
