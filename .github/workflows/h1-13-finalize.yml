name: H1.13 finalizer

on:
  push:
    branches:
      - fix/h1-13-financeiro-banco-typescript

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/h1-13-financeiro-banco-typescript
          fetch-depth: 0
      - name: Patch H1.13 documentation
        run: python3 scripts/h1-13-finalize.py
      - name: Clean temporary instrumentation and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/qa/typecheck-ratchet.mjs
          rm -f .github/workflows/h1-13-typescript-diagnostic.yml
          rm -f qa/h1-13-validation-trigger.txt
          rm -f scripts/h1-13-finalize.py
          rm -f .github/workflows/h1-13-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(h1.13): close TypeScript debt at zero'
          git push origin HEAD:fix/h1-13-financeiro-banco-typescript
