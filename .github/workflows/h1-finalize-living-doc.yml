name: H1 Finalize Living Doc

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-living-doc:
    if: github.head_ref == 'hardening/h1-1-dependency-ratchets' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/h1-1-dependency-ratchets
          fetch-depth: 0
      - name: Mark H1.1 validation green
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/ESTADO_VIVO_DESENVOLVIMENTO.md')
          text = path.read_text()
          text = text.replace('### H1.1 — Remediação compatível + ratchets — em validação na PR #205', '### H1.1 — Remediação compatível + ratchets — validada na CI #720 / PR #205', 1)
          text = text.replace('Em validação final. Residual controlado: 3 advisories Laravel 11, 1 high `xlsx`, 132 erros TS/55 ficheiros.', 'CI #720 totalmente verde. Residual controlado: 3 advisories Laravel 11, 1 high `xlsx`, 132 erros TS/55 ficheiros.', 1)
          path.write_text(text)
      - name: Commit living doc
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Bzuzinho'
          git config user.email 'ricardo.jgvf@gmail.com'
          git add docs/ESTADO_VIVO_DESENVOLVIMENTO.md
          git diff --cached --quiet && { echo 'Living doc already finalized'; exit 0; }
          git commit -m 'docs(h1): registar CI verde da H1.1'
          git push origin HEAD:hardening/h1-1-dependency-ratchets
