name: Reconciliation synchronize runner

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/reconciliation-actions-score-final3' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/reconciliation-actions-score-final3
          token: ${{ github.token }}

      - name: Update branch from main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_pgsql, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Apply correction
        run: python3 bin/apply-reconciliation-actions-fix.py

      - name: Validate correction
        run: |
          php -l app/Http/Controllers/Financeiro/BankReconciliationSuggestionController.php
          php -l app/Services/Financeiro/BankReconciliationSuggestionService.php
          php artisan test \
            tests/Feature/Financeiro/BankReconciliationManualMemberEditingContractTest.php \
            tests/Feature/Financeiro/BankReconciliationExactAllocationActionsContractTest.php
          npm run build

      - name: Commit correction
        run: |
          git add -A
          git commit -m 'Fix reconciliation actions for fully allocated suggestions'
          git push origin HEAD:fix/reconciliation-actions-score-final3
