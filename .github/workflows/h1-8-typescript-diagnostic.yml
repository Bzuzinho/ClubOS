name: H1.8 TypeScript Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'cleanup/h1-8-typescript-low-risk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print full TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/tsc.txt
          status=${PIPESTATUS[0]}
          echo "tsc_exit_status=${status}"
          echo "diagnostic_lines=$(wc -l < /tmp/tsc.txt)"
          exit 0
