name: Apply mensalidades bank trace patch

on:
  push:
    branches:
      - feat/financeiro-mensalidades-bank-trace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/financeiro-mensalidades-bank-trace
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected anchor exactly once, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          faturas = 'resources/js/Pages/Financeiro/FaturasTab.tsx'

          replace_once(
              faturas,
              "import { Plus, MagicWand, X, Check, Trash, PencilSimple, SquaresFour, ListBullets } from '@phosphor-icons/react';",
              "import { Plus, MagicWand, X, Check, Trash, PencilSimple, SquaresFour, ListBullets, Bank } from '@phosphor-icons/react';",
          )

          helper_anchor = """  const getInvoicePaidAmount = (invoice: Fatura) => Math.max(toNumber(invoice.valor_pago, 0), 0);\n\n  const resetPaymentDialog = () => {"""
          helper_replacement = """  const getInvoicePaidAmount = (invoice: Fatura) => Math.max(toNumber(invoice.valor_pago, 0), 0);\n\n  type InvoiceBankReconciliationTrace = {\n    reconciliation: ConciliacaoMapa;\n    statement: ExtratoBancario;\n  };\n\n  const bankReconciliationsByInvoiceId = useMemo(() => {\n    const statementsById = new Map<string, ExtratoBancario>(\n      (extratos || []).map((statement) => [statement.id, statement] as const),\n    );\n    const ignoredStatuses = new Set(['cancelled', 'cancelado', 'reversed', 'anulado']);\n    const grouped = new Map<string, InvoiceBankReconciliationTrace[]>();\n\n    (conciliacoes || []).forEach((reconciliation) => {\n      if (!reconciliation.fatura_id) {\n        return;\n      }\n\n      const normalizedStatus = String(reconciliation.status || '').trim().toLowerCase();\n      if (normalizedStatus && ignoredStatuses.has(normalizedStatus)) {\n        return;\n      }\n\n      const statement = statementsById.get(reconciliation.extrato_id);\n      if (!statement) {\n        return;\n      }\n\n      const traces = grouped.get(reconciliation.fatura_id) || [];\n      if (!traces.some(({ reconciliation: existing }) => existing.id === reconciliation.id)) {\n        traces.push({ reconciliation, statement });\n        grouped.set(reconciliation.fatura_id, traces);\n      }\n    });\n\n    grouped.forEach((traces) => {\n      traces.sort((left, right) => (\n        new Date(right.statement.data_movimento).getTime() - new Date(left.statement.data_movimento).getTime()\n      ));\n    });\n\n    return grouped;\n  }, [conciliacoes, extratos]);\n\n  const formatBankStatementDate = (value: string) => {\n    const parsed = new Date(value);\n    return Number.isNaN(parsed.getTime()) ? value : format(parsed, 'dd/MM/yyyy');\n  };\n\n  const renderBankReconciliationTrace = (invoiceId: string, compact = false) => {\n    const traces = bankReconciliationsByInvoiceId.get(invoiceId) || [];\n\n    if (traces.length === 0) {\n      return <span className=\"text-[10px] text-muted-foreground\">Sem conciliação bancária</span>;\n    }\n\n    return (\n      <div className={compact ? 'space-y-1' : 'space-y-1.5'}>\n        {traces.map(({ reconciliation, statement }) => {\n          const statementAmount = Math.abs(toNumber(statement.valor, 0));\n          const reconciledAmount = Math.abs(toNumber(reconciliation.valor_conciliado, statementAmount));\n          const metadata = [\n            statement.referencia ? `Ref. ${statement.referencia}` : null,\n            statement.conta ? `Conta ${statement.conta}` : null,\n          ].filter(Boolean).join(' · ');\n          const title = [\n            formatBankStatementDate(statement.data_movimento),\n            statement.descricao,\n            statement.referencia ? `Ref. ${statement.referencia}` : null,\n            statement.conta ? `Conta ${statement.conta}` : null,\n            `Conciliado: €${reconciledAmount.toFixed(2)}`,\n            statementAmount > 0 && Math.abs(statementAmount - reconciledAmount) > 0.009\n              ? `Movimento bancário: €${statementAmount.toFixed(2)}`\n              : null,\n          ].filter(Boolean).join(' · ');\n\n          return (\n            <div\n              key={reconciliation.id}\n              className={compact\n                ? 'min-w-0 rounded border px-2 py-1 text-[10px] text-muted-foreground'\n                : 'min-w-0 rounded border bg-background/70 px-2 py-1.5 text-[10px] text-muted-foreground'}\n              title={title}\n            >\n              <div className=\"flex items-center gap-1 font-medium text-foreground\">\n                <Bank size={12} className=\"shrink-0\" />\n                <span>{formatBankStatementDate(statement.data_movimento)}</span>\n                <span>· €{reconciledAmount.toFixed(2)}</span>\n              </div>\n              <div className=\"truncate\">{statement.descricao || 'Sem descrição'}</div>\n              {metadata && <div className=\"truncate\">{metadata}</div>}\n              {statementAmount > 0 && Math.abs(statementAmount - reconciledAmount) > 0.009 && (\n                <div>Movimento bancário: €{statementAmount.toFixed(2)}</div>\n              )}\n            </div>\n          );\n        })}\n      </div>\n    );\n  };\n\n  const resetPaymentDialog = () => {"""
          replace_once(faturas, helper_anchor, helper_replacement)

          card_anchor = """                          <div className=\"text-[10px] text-muted-foreground mt-1\">\n                            Vence: {format(new Date(fatura.data_vencimento), 'dd/MM/yyyy')}\n                          </div>\n                        </div>"""
          card_replacement = """                          <div className=\"text-[10px] text-muted-foreground mt-1\">\n                            Vence: {format(new Date(fatura.data_vencimento), 'dd/MM/yyyy')}\n                          </div>\n                          {fatura.tipo === 'mensalidade' && (\n                            <div className=\"mt-2 rounded-md border bg-muted/30 p-2\">\n                              <div className=\"mb-1 flex items-center gap-1 text-[10px] font-medium text-foreground\">\n                                <Bank size={12} />\n                                <span>Conciliação bancária</span>\n                              </div>\n                              {renderBankReconciliationTrace(fatura.id)}\n                            </div>\n                          )}\n                        </div>"""
          replace_once(faturas, card_anchor, card_replacement)

          header_anchor = """                    <TableHead className=\"hidden md:table-cell w-20\">Estado</TableHead>\n                    <TableHead className=\"w-48 text-right\">Acoes</TableHead>"""
          header_replacement = """                    <TableHead className=\"hidden md:table-cell w-20\">Estado</TableHead>\n                    <TableHead className=\"hidden xl:table-cell min-w-[220px]\">Conciliação bancária</TableHead>\n                    <TableHead className=\"w-48 text-right\">Acoes</TableHead>"""
          replace_once(faturas, header_anchor, header_replacement)

          replace_once(
              faturas,
              '<TableCell colSpan={10} className="text-center text-muted-foreground py-8">',
              '<TableCell colSpan={11} className="text-center text-muted-foreground py-8">',
          )

          row_anchor = """                          <TableCell className=\"hidden md:table-cell text-xs\">{getEstadoBadge(fatura.estado_pagamento)}</TableCell>\n                          <TableCell>"""
          row_replacement = """                          <TableCell className=\"hidden md:table-cell text-xs\">{getEstadoBadge(fatura.estado_pagamento)}</TableCell>\n                          <TableCell className=\"hidden xl:table-cell text-xs\">\n                            {fatura.tipo === 'mensalidade'\n                              ? renderBankReconciliationTrace(fatura.id, true)\n                              : <span className=\"text-muted-foreground\">—</span>}\n                          </TableCell>\n                          <TableCell>"""
          replace_once(faturas, row_anchor, row_replacement)

          controller = 'app/Http/Controllers/FinanceiroController.php'
          controller_old = """                    // Try to select with all fields first, fallback if valor_conciliado doesn't exist\n                    return MapaConciliacao::select(\n                        'id',\n                        'extrato_id',\n                        'lancamento_id',\n                        'fatura_id',\n                        'movimento_id',\n                        'estado_fatura_anterior',\n                        'estado_movimento_anterior',\n                        'valor_conciliado'\n                    )->get();"""
          controller_new = """                    // Expose the canonical reconciliation trace needed by Mensalidades/Banco.\n                    return MapaConciliacao::select(\n                        'id',\n                        'extrato_id',\n                        'lancamento_id',\n                        'fatura_id',\n                        'movimento_id',\n                        'payment_id',\n                        'payment_allocation_id',\n                        'bank_reconciliation_suggestion_id',\n                        'estado_fatura_anterior',\n                        'estado_movimento_anterior',\n                        'valor_conciliado',\n                        'status',\n                        'regra_usada',\n                        'score',\n                        'metadata',\n                        'created_at'\n                    )->get();"""
          replace_once(controller, controller_old, controller_new)

          tests = Path('tests/Feature/Financeiro/FaturasTabFlowContractTest.php')
          test_text = tests.read_text(encoding='utf-8')
          class_suffix = "\n}\n"
          if not test_text.endswith(class_suffix):
              raise SystemExit('FaturasTabFlowContractTest.php: unexpected class ending')
          test_addition = r'''

    public function test_mensalidades_show_the_bank_reconciliation_trace_and_ignore_reversed_maps(): void
    {
        $source = file_get_contents(resource_path('js/Pages/Financeiro/FaturasTab.tsx'));

        $this->assertIsString($source);
        $this->assertStringContainsString('const bankReconciliationsByInvoiceId = useMemo(() => {', $source);
        $this->assertStringContainsString("new Set(['cancelled', 'cancelado', 'reversed', 'anulado'])", $source);
        $this->assertStringContainsString('Conciliação bancária', $source);
        $this->assertStringContainsString('reconciliation.valor_conciliado', $source);
        $this->assertStringContainsString('statement.data_movimento', $source);
        $this->assertStringContainsString('statement.descricao', $source);
        $this->assertStringContainsString('statement.referencia', $source);
        $this->assertStringContainsString('statement.conta', $source);
        $this->assertStringContainsString('Movimento bancário:', $source);
    }

    public function test_financeiro_index_exposes_the_canonical_reconciliation_trace_fields(): void
    {
        $source = file_get_contents(app_path('Http/Controllers/FinanceiroController.php'));

        $this->assertIsString($source);
        $this->assertStringContainsString("'payment_id',", $source);
        $this->assertStringContainsString("'payment_allocation_id',", $source);
        $this->assertStringContainsString("'bank_reconciliation_suggestion_id',", $source);
        $this->assertStringContainsString("'valor_conciliado',", $source);
        $this->assertStringContainsString("'status',", $source);
        $this->assertStringContainsString("'regra_usada',", $source);
        $this->assertStringContainsString("'metadata',", $source);
    }
'''
          tests.write_text(test_text[:-len(class_suffix)] + test_addition + class_suffix, encoding='utf-8')

          docs = 'docs/ESTADO_VIVO_DESENVOLVIMENTO.md'
          docs_old = "| Financeiro geral | 91% | Maduro; CRUDs legacy aposentados e liquidações convergem no fluxo canónico. H5d acrescenta `payment_reversals` imutáveis e cancela logicamente alocações, lançamentos e mapas sem apagar o rasto original; a compensação financeira da devolução fica explícita e idempotente. |"
          docs_new = "| Financeiro geral | 91% | Maduro; CRUDs legacy aposentados e liquidações convergem no fluxo canónico. H5d acrescenta `payment_reversals` imutáveis e cancela logicamente alocações, lançamentos e mapas sem apagar o rasto original; a compensação financeira da devolução fica explícita e idempotente. A tab Mensalidades expõe a linha bancária que suportou cada conciliação ativa, incluindo data, descrição, referência/conta, valor imputado e valor total do movimento quando existe repartição, sem apresentar mapas anulados/revertidos como conciliações válidas. |"
          replace_once(docs, docs_old, docs_new)
          PY

          rm .github/workflows/patch-mensalidades-bank-trace.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/Pages/Financeiro/FaturasTab.tsx \
                  app/Http/Controllers/FinanceiroController.php \
                  tests/Feature/Financeiro/FaturasTabFlowContractTest.php \
                  docs/ESTADO_VIVO_DESENVOLVIMENTO.md \
                  .github/workflows/patch-mensalidades-bank-trace.yml
          git diff --cached --check
          git commit -m "feat: show bank reconciliation trace on mensalidades"
          git push origin HEAD:feat/financeiro-mensalidades-bank-trace
