name: Apply mensalidades bank trace patch

on:
  push:
    branches:
      - feat/financeiro-mensalidades-bank-trace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/financeiro-mensalidades-bank-trace
          fetch-depth: 0

      - name: Apply focused patch
        run: python3 .github/scripts/apply_mensalidades_bank_trace_patch.py

      - name: Remove temporary patch tooling
        run: |
          rm .github/scripts/apply_mensalidades_bank_trace_patch.py
          rm .github/workflows/patch-mensalidades-bank-trace.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/Pages/Financeiro/FaturasTab.tsx app/Http/Controllers/FinanceiroController.php tests/Feature/Financeiro/FaturasTabFlowContractTest.php docs/ESTADO_VIVO_DESENVOLVIMENTO.md .github
          git diff --cached --check
          git commit -m "feat: show bank reconciliation trace on mensalidades"
          git push origin HEAD:feat/financeiro-mensalidades-bank-trace
