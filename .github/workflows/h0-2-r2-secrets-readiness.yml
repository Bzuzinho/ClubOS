name: H0.2 R2 Secrets Readiness

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-r2-readiness:
    if: github.head_ref == 'diag/h0-2-r2-secrets-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DR_R2_ENDPOINT: ${{ secrets.CLUBOS_DR_R2_ENDPOINT }}
      DR_R2_BUCKET: ${{ secrets.CLUBOS_DR_R2_BUCKET }}
      DR_R2_ACCESS_KEY_ID: ${{ secrets.CLUBOS_DR_R2_ACCESS_KEY_ID }}
      DR_R2_SECRET_ACCESS_KEY: ${{ secrets.CLUBOS_DR_R2_SECRET_ACCESS_KEY }}
      DR_BACKUP_PASSPHRASE: ${{ secrets.CLUBOS_DR_BACKUP_PASSPHRASE }}
    steps:
      - name: Inspect secret presence without exposing values
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            DR_R2_ENDPOINT \
            DR_R2_BUCKET \
            DR_R2_ACCESS_KEY_ID \
            DR_R2_SECRET_ACCESS_KEY \
            DR_BACKUP_PASSPHRASE; do
            if [[ -n "${!name:-}" ]]; then
              echo "${name}=present"
            else
              echo "${name}=missing"
              missing=$((missing + 1))
            fi
          done

          if (( missing == 0 )); then
            echo 'ready=yes' >> "${GITHUB_OUTPUT}"
            echo 'r2_config_secrets_ready=yes'
          else
            echo 'ready=no' >> "${GITHUB_OUTPUT}"
            echo "r2_config_secrets_ready=no"
            echo "missing_secret_count=${missing}"
          fi

      - name: Verify R2 bucket access
        if: steps.readiness.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y rclone >/dev/null

          export RCLONE_CONFIG_R2_TYPE='s3'
          export RCLONE_CONFIG_R2_PROVIDER='Cloudflare'
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="${DR_R2_ACCESS_KEY_ID}"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${DR_R2_SECRET_ACCESS_KEY}"
          export RCLONE_CONFIG_R2_ENDPOINT="${DR_R2_ENDPOINT%/}"
          export RCLONE_CONFIG_R2_REGION='auto'
          export RCLONE_CONFIG_R2_ACL='private'

          rclone lsf "r2:${DR_R2_BUCKET}" --max-depth 1 >/dev/null
          echo 'r2_bucket_access=ok'

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## H0.2 R2 readiness'
            echo ''
            if [[ "${{ steps.readiness.outputs.ready }}" == 'yes' ]]; then
              echo '- Required repository secrets: present'
              echo '- R2 bucket access check: attempted in previous step'
            else
              echo '- Required repository secrets: incomplete'
              echo '- No secret value was printed or stored as artifact'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
