name: H2 Family JSON Diagnostic

on:
  push:
    branches:
      - h2/family-json-mirror-cutover
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2-json-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: JSON mirror audit contracts
        run: php artisan test tests/Feature/Membros/FamilyJsonMirrorCutoverAuditTest.php

      - name: Canonical write regression file
        run: php artisan test tests/Feature/Membros/FamilyRelationshipServiceCanonicalWriteTest.php
