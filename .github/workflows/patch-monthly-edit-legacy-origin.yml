name: Apply monthly edit fix

on:
  push:
    branches:
      - fix/financeiro-monthly-edit-legacy-origin

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/financeiro-monthly-edit-legacy-origin
          fetch-depth: 0
      - run: python3 .github/scripts/patch-monthly-edit-legacy-origin.py
      - run: rm .github/scripts/patch-monthly-edit-legacy-origin.py .github/workflows/patch-monthly-edit-legacy-origin.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow editing legacy monthly invoices"
          git push origin HEAD:fix/financeiro-monthly-edit-legacy-origin
