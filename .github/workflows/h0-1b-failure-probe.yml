name: H0.1b Failure Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VM_USER: ${{ secrets.ORACLE_VM_USER }}
      VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      VM_APP_DIR: ${{ secrets.ORACLE_VM_APP_DIR }}
      VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
      EXPECTED_SHA: bcb6422f506790c538f38b73aeacfac23650af10
    steps:
      - name: Configure SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_VM_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${VM_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"
      - name: Probe failed deployment stage
        shell: bash
        run: |
          set -euo pipefail
          report="${GITHUB_WORKSPACE}/h0-1b-failure-probe.txt"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "APP_DIR='${VM_APP_DIR}' DEPLOY_USER='${VM_USER}' EXPECTED_SHA='${EXPECTED_SHA}' bash -s" <<'REMOTE' | tee "${report}"
          set +e
          DEPLOY_ROOT="${APP_DIR}.deploy"
          REPOSITORY_DIR="${DEPLOY_ROOT}/repository.git"
          RELEASES_DIR="${DEPLOY_ROOT}/releases"
          SHARED_DIR="${DEPLOY_ROOT}/shared"
          PERSIST_ROOT="${DEPLOY_ROOT}/legacy-persistence"

          run() {
            label="$1"; shift
            echo "--- ${label} ---"
            "$@"
            rc=$?
            echo "rc=${rc}"
            return 0
          }

          run 'refs/remotes/origin/main' sudo -u "${DEPLOY_USER}" -H git --git-dir="${REPOSITORY_DIR}" rev-parse refs/remotes/origin/main
          run 'expected commit exists' sudo -u "${DEPLOY_USER}" -H git --git-dir="${REPOSITORY_DIR}" cat-file -e "${EXPECTED_SHA}^{commit}"
          run 'deploy user can write releases' sudo -u "${DEPLOY_USER}" -H test -w "${RELEASES_DIR}"

          echo '--- live persistence state ---'
          printf 'app_env_kind=%s\n' "$(if [[ -L "${APP_DIR}/.env" ]]; then echo symlink; elif [[ -f "${APP_DIR}/.env" ]]; then echo file; else echo missing; fi)"
          printf 'app_storage_kind=%s\n' "$(if [[ -L "${APP_DIR}/storage" ]]; then echo symlink; elif [[ -d "${APP_DIR}/storage" ]]; then echo directory; else echo missing; fi)"
          printf 'app_env_real=%s\n' "$(readlink -f "${APP_DIR}/.env" 2>/dev/null || true)"
          printf 'app_storage_real=%s\n' "$(readlink -f "${APP_DIR}/storage" 2>/dev/null || true)"
          printf 'shared_env_real=%s\n' "$(readlink -f "${SHARED_DIR}/.env" 2>/dev/null || true)"
          printf 'shared_storage_real=%s\n' "$(readlink -f "${SHARED_DIR}/storage" 2>/dev/null || true)"
          echo '--- persistence backups ---'
          find "${PERSIST_ROOT}" -mindepth 1 -maxdepth 2 -printf '%y %M %u:%g %p -> %l\n' 2>/dev/null | sort || true

          echo '--- helper timestamps ---'
          stat -c '%y %U:%G %a %n' /usr/local/bin/clubmanager-healthcheck.sh /usr/local/bin/clubmanager-rollback-release.sh /usr/local/bin/clubmanager-deploy-backend.sh 2>/dev/null || true

          echo '--- current app migration preflight ---'
          run 'migrate status' sudo -u www-data -H php "${APP_DIR}/artisan" migrate:status --no-ansi
          run 'migrate pretend' sudo -u www-data -H php "${APP_DIR}/artisan" migrate --pretend --force --no-ansi

          echo '--- current app internal /up via php built-in server ---'
          port="$(python3 - <<'PY'
          import socket
          s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()
          PY
          )"
          log_file="/tmp/h01b-probe-php-server.log"
          pid="$(sudo -u www-data -H bash -c 'cd "$1"; php -S "127.0.0.1:$2" -t public vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php >"$3" 2>&1 & echo $!' _ "${APP_DIR}" "${port}" "${log_file}")"
          status=""
          for _ in $(seq 1 20); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 "http://127.0.0.1:${port}/up" 2>/dev/null || true)"
            [[ "${status}" == "200" ]] && break
            sleep 0.2
          done
          echo "internal_up_http=${status:-none}"
          kill "${pid}" >/dev/null 2>&1 || true
          if [[ "${status}" != "200" ]]; then
            sed -n '1,160p' "${log_file}" 2>/dev/null || true
          fi
          rm -f "${log_file}"

          echo '--- renameat2 exchange probe ---'
          test_dir="${DEPLOY_ROOT}/.probe-exchange-dir.$$"
          test_link="${DEPLOY_ROOT}/.probe-exchange-link.$$"
          mkdir "${test_dir}"
          ln -s "${test_dir}" "${test_link}"
          python3 - "${test_dir}" "${test_link}" <<'PY'
          import ctypes, os, sys
          libc=ctypes.CDLL(None,use_errno=True)
          fn=getattr(libc,'renameat2',None)
          if fn is None:
              print('renameat2=missing'); raise SystemExit(1)
          fn.argtypes=[ctypes.c_int,ctypes.c_char_p,ctypes.c_int,ctypes.c_char_p,ctypes.c_uint]
          fn.restype=ctypes.c_int
          rc=fn(-100,os.fsencode(sys.argv[1]),-100,os.fsencode(sys.argv[2]),2)
          print(f'renameat2_rc={rc} errno={ctypes.get_errno()}')
          raise SystemExit(0 if rc == 0 else 1)
          PY
          exchange_rc=$?
          echo "renameat2_probe_rc=${exchange_rc}"
          rm -rf "${test_dir}" "${test_link}"
          REMOTE
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: h0-1b-failure-probe-${{ github.sha }}
          path: h0-1b-failure-probe.txt
          if-no-files-found: error
          retention-days: 7
