name: Validate and deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Laravel and frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run Laravel tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  deploy:
    name: Deploy ClubOS to Oracle VM
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      VM_USER: ${{ secrets.ORACLE_VM_USER || 'ubuntu' }}
      VM_HOST: ${{ secrets.ORACLE_VM_HOST || '129.159.13.211' }}
      VM_APP_DIR: ${{ secrets.ORACLE_VM_APP_DIR || '/var/www/clubmanager' }}
      SSH_KEY: /home/runner/.ssh/id_ed25519
      APP_NAME: ClubOS
      APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
      ALLOW_SHARED_DB: '0'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure production SSH key
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${ORACLE_VM_SSH_KEY}" ]]; then
            echo "::error::Missing GitHub secret ORACLE_VM_SSH_KEY"
            exit 1
          fi

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_VM_SSH_KEY}" > "${SSH_KEY}"
          chmod 600 "${SSH_KEY}"
          ssh-keygen -y -f "${SSH_KEY}" > "${SSH_KEY}.pub"
          chmod 644 "${SSH_KEY}.pub"

      - name: Deploy production
        shell: bash
        run: npm run deploy:vm

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## ClubOS production deploy'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Target: \`${VM_USER}@${VM_HOST}:${VM_APP_DIR}\`"
            echo '- Validation: Laravel tests and frontend build passed'
            echo '- Result: successful'
          } >> "${GITHUB_STEP_SUMMARY}"
