name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_mysql, pdo_pgsql, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Validate deployment and QA scripts
        run: |
          node --check bin/deploy-vm.mjs
          node --check scripts/qa/typecheck-ratchet.mjs
          node --check scripts/qa/npm-audit-ratchet.mjs
          node --check scripts/qa/xlsx-import-contract.mjs
          node --check eslint.config.js
          bash -n bin/remote-deploy-backend.sh
          bash -n scripts/qa/composer-audit-ratchet.sh

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        run: bash scripts/qa/composer-audit-ratchet.sh

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: node scripts/qa/npm-audit-ratchet.mjs

      - name: Verify spreadsheet import contract
        run: node scripts/qa/xlsx-import-contract.mjs

      - name: TypeScript debt ratchet
        run: npm run typecheck:ratchet

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend unit/component tests
        run: npm run test:unit

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: php artisan test

      - name: Run legacy members read guard rail
        run: php artisan members:audit-users-legacy-read --fail-on-finding

  frontend-browser-qa:
    name: Frontend browser QA
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      CACHE_STORE: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      DB_PROTECT_DESTRUCTIVE_COMMANDS: 'false'
      DB_ALLOW_DESTRUCTIVE_COMMANDS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare browser-test environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force

      - name: Build frontend for browser tests
        run: npm run build

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run multi-browser, mobile and accessibility E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  postgres-concurrency:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clubos_test
          POSTGRES_USER: clubos_test
          POSTGRES_PASSWORD: clubos_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_test -d clubos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: clubos_test
      DB_USERNAME: clubos_test
      DB_PASSWORD: clubos_test_ci_only
      DB_PROTECT_DESTRUCTIVE_COMMANDS: 'false'
      DB_ALLOW_DESTRUCTIVE_COMMANDS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare PostgreSQL schema
        run: php artisan migrate --force

      - name: Run PostgreSQL concurrency test
        run: php artisan test tests/Feature/Financeiro/PostgresMixedBankReconciliationConcurrencyTest.php

  deploy-production:
    name: Deploy production to Oracle VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - frontend-browser-qa
      - postgres-concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: clubos-production-deploy
      cancel-in-progress: false

    env:
      VM_USER: ${{ secrets.ORACLE_VM_USER }}
      VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      VM_APP_DIR: ${{ secrets.ORACLE_VM_APP_DIR }}
      VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Validate production deployment configuration
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          for variable in VM_USER VM_HOST VM_APP_DIR VM_KNOWN_HOSTS ORACLE_VM_SSH_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required production deployment secret/configuration: ${variable}"
              exit 1
            fi
          done

          if [[ "${VM_APP_DIR}" != /* ]]; then
            echo "::error::VM_APP_DIR must be an absolute path"
            exit 1
          fi

      - name: Configure SSH access
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${VM_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          printf '%s\n' "${ORACLE_VM_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

      - name: Deploy main to production
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: node bin/deploy-vm.mjs

      - name: Collect Desportivo production legacy readiness audit
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i "${HOME}/.ssh/id_ed25519" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan desportivo:audit-legacy-readiness --json" \
            > artifacts/desportivo-legacy-readiness.json

      - name: Upload Desportivo production legacy readiness audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desportivo-legacy-readiness-${{ github.sha }}
          path: artifacts/desportivo-legacy-readiness.json
          if-no-files-found: warn
          retention-days: 30

      - name: Collect Access Control production readiness audit
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i "${HOME}/.ssh/id_ed25519" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan access-control:audit-readiness --json" \
            > artifacts/access-control-readiness.json

      - name: Upload Access Control production readiness audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: access-control-readiness-${{ github.sha }}
          path: artifacts/access-control-readiness.json
          if-no-files-found: warn
          retention-days: 30

      - name: Gate Access Control critical findings
        run: |
          set -euo pipefail
          php -r '
            $file = "artifacts/access-control-readiness.json";
            if (! is_file($file)) {
                fwrite(STDERR, "Missing Access Control readiness artifact.\n");
                exit(1);
            }
            $payload = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
            $critical = (int) ($payload["critical_count"] ?? 0);
            if ($critical > 0) {
                fwrite(STDERR, "Access Control readiness gate failed: {$critical} critical findings.\n");
                exit(1);
            }
            echo "Access Control readiness gate passed: 0 critical findings.\n";
          '

      - name: Deployment summary
        run: |
          set -euo pipefail
          php -r '
            $readJson = static function (string $path): array {
                if (! is_file($path)) {
                    return [];
                }
                $decoded = json_decode((string) file_get_contents($path), true);
                return is_array($decoded) ? $decoded : [];
            };

            $sports = $readJson("artifacts/desportivo-legacy-readiness.json");
            $access = $readJson("artifacts/access-control-readiness.json");

            $sportsCritical = (int) ($sports["critical_count"] ?? 0);
            $sportsWarnings = (int) ($sports["warning_count"] ?? 0);
            $accessCritical = (int) ($access["critical_count"] ?? 0);
            $accessWarnings = (int) ($access["warning_count"] ?? 0);

            $lines = [
                "## Production deployment",
                "",
                "- SHA: `" . getenv("GITHUB_SHA") . "`",
                "- Desportivo legacy readiness: {$sportsCritical} critical / {$sportsWarnings} warning",
                "- Access Control readiness: {$accessCritical} critical / {$accessWarnings} warning",
            ];

            file_put_contents((string) getenv("GITHUB_STEP_SUMMARY"), implode(PHP_EOL, $lines) . PHP_EOL, FILE_APPEND);
          '
