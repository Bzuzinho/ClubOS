name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_mysql, pdo_pgsql, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Validate deployment and QA scripts
        run: |
          node --check bin/deploy-vm.mjs
          node --check scripts/qa/typecheck-ratchet.mjs
          node --check scripts/qa/npm-audit-ratchet.mjs
          node --check scripts/qa/xlsx-import-contract.mjs
          node --check eslint.config.js
          bash -n bin/remote-deploy-backend.sh
          bash -n scripts/qa/composer-audit-ratchet.sh

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        run: bash scripts/qa/composer-audit-ratchet.sh

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: node scripts/qa/npm-audit-ratchet.mjs

      - name: Verify spreadsheet import contract
        run: node scripts/qa/xlsx-import-contract.mjs

      - name: TypeScript debt ratchet
        run: npm run typecheck:ratchet

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend unit/component tests
        run: npm run test:unit

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify web route topology contract
        shell: bash
        run: |
          set -euo pipefail

          report="${GITHUB_WORKSPACE}/web-route-topology.json"
          php artisan routes:audit-web-topology \
            --json \
            --report-path="${report}" \
            --fail-on-contract-drift \
            >/dev/null

          jq -e '
            .version == "web-route-topology-v1"
            and .read_only == true
            and .summary.web_route_count > 0
            and .summary.named_route_lookup_count > 0
            and .summary.contract_matches_baseline == true
            and .summary.fallback_route_count == 1
            and .contract.fallback_name == "public.custom-page"
            and .summary.source_literal_duplicate_candidate_count == 0
            and .summary.source_literal_duplicate_unclassified_count == 0
            and .summary.legacy_redirect_consumer_count == 0
            and .summary.retired_shadowed_alias_reference_count == 0
            and .summary.modular_route_file_count == 36
            and .summary.loaded_modular_route_file_count == .summary.modular_route_file_count
            and .contract.hash == .contract.baseline_hash
            and .interpretation.no_routes_changed == true
          ' "${report}" >/dev/null

      - name: Upload web route topology audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-route-topology-${{ github.sha }}
          path: web-route-topology.json
          if-no-files-found: error
          retention-days: 30

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: php artisan test

      - name: Run legacy members read guard rail
        run: php artisan members:audit-users-legacy-read --fail-on-finding

  frontend-browser-qa:
    name: Frontend browser QA
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      DB_PROTECT_DESTRUCTIVE_COMMANDS: 'false'
      DB_ALLOW_DESTRUCTIVE_COMMANDS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare browser-test environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force

      - name: Build frontend for browser tests
        run: npm run build

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run multi-browser, mobile and accessibility E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  postgres-concurrency:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clubos_test
          POSTGRES_USER: clubos_test
          POSTGRES_PASSWORD: clubos_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_test -d clubos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: clubos_test
      DB_USERNAME: clubos_test
      DB_PASSWORD: clubos_test_ci_only
      DB_PROTECT_DESTRUCTIVE_COMMANDS: 'false'
      DB_ALLOW_DESTRUCTIVE_COMMANDS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare PostgreSQL schema
        run: php artisan migrate --force

      - name: Run PostgreSQL concurrency test
        run: php artisan test tests/Feature/Financeiro/PostgresMixedBankReconciliationConcurrencyTest.php

  deploy-production:
    name: Deploy production to Oracle VM
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs:
      - validate
      - frontend-browser-qa
      - postgres-concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: clubos-production-deploy
      cancel-in-progress: false

    env:
      VM_USER: ${{ secrets.ORACLE_VM_USER }}
      VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      VM_APP_DIR: ${{ secrets.ORACLE_VM_APP_DIR }}
      VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Validate production deployment configuration
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          for variable in VM_USER VM_HOST VM_APP_DIR VM_KNOWN_HOSTS ORACLE_VM_SSH_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required production deployment secret/configuration: ${variable}"
              exit 1
            fi
          done

          if [[ "${VM_APP_DIR}" != /* ]]; then
            echo "::error::VM_APP_DIR must be an absolute path"
            exit 1
          fi

      - name: Configure SSH access
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_VM_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

          ssh-keygen -y -f "${HOME}/.ssh/id_ed25519" > /dev/null
          printf '%s\n' "${VM_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

          if ! ssh-keygen -F "${VM_HOST}" -f "${HOME}/.ssh/known_hosts" > /dev/null; then
            echo "::error::Pinned known_hosts does not contain an entry for ${VM_HOST}"
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            'echo SSH_OK'

      - name: Deploy main to production
        run: npm run deploy:vm

      - name: Collect Desportivo production legacy readiness audit
        id: sports_legacy_audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${RUNNER_TEMP}/desportivo-legacy-schema-data-readiness.json"
          remote_report="/tmp/clubos-desportivo-legacy-schema-data-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan desportivo:audit-legacy-schema-data --require-closed --json='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          jq -e '.read_only == true and .version == "sports-legacy-schema-data-readiness-v1" and .summary.cleanup_closed == true' "${local_report}" >/dev/null
          cp "${local_report}" "${GITHUB_WORKSPACE}/desportivo-legacy-schema-data-readiness.json"

          {
            echo '## Desportivo production legacy readiness audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Read-only: \`$(jq -r '.read_only' "${local_report}")\`"
            echo "- Forbidden tables inventoried: \`$(jq -r '.summary.forbidden_table_count' "${local_report}")\`"
            echo "- Removal candidates: \`$(jq -r '.summary.removal_candidate_count' "${local_report}")\`"
            echo "- Candidates physically removed: \`$(jq -r '.summary.removal_complete_count' "${local_report}")\`"
            echo "- Candidates ready but still present: \`$(jq -r '.summary.removal_ready_count' "${local_report}")\`"
            echo "- Candidates blocked: \`$(jq -r '.summary.removal_blocked_count' "${local_report}")\`"
            echo "- Candidate rows requiring review: \`$(jq -r '.summary.candidate_rows_requiring_review' "${local_report}")\`"
            echo "- Unreconciled legacy presences: \`$(jq -r '.summary.presence_unreconciled_count' "${local_report}")\`"
            echo "- Legacy alias columns still present: \`$(jq -r '.summary.legacy_alias_columns_present' "${local_report}")\`"
            echo "- Sports cleanup closed: \`$(jq -r '.summary.cleanup_closed' "${local_report}")\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Desportivo production legacy readiness audit
        uses: actions/upload-artifact@v7
        with:
          name: desportivo-production-legacy-readiness-${{ github.sha }}
          path: desportivo-legacy-schema-data-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect Access Control production readiness audit
        id: access_control_audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${RUNNER_TEMP}/access-control-readiness.json"
          remote_report="/tmp/clubos-access-control-readiness-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan access:audit-readiness --report-path='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          jq -e '.read_only == true and .contract == "access-control-readiness-v1"' "${local_report}" >/dev/null
          cp "${local_report}" "${GITHUB_WORKSPACE}/access-control-readiness.json"

          critical_count="$(jq -r '.summary.critical_count' "${local_report}")"

          if ! [[ "${critical_count}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Access Control critical_count: ${critical_count}"
            exit 1
          fi

          echo "critical_count=${critical_count}" >> "${GITHUB_OUTPUT}"

          {
            echo '## Access Control production readiness audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Read-only: \`$(jq -r '.read_only' "${local_report}")\`"
            echo "- Platform access users: \`$(jq -r '.summary.platform_access_user_count' "${local_report}")\`"
            echo "- Resolved UserTypes: \`$(jq -r '.summary.resolved_user_type_count' "${local_report}")\`"
            echo "- Unresolved UserTypes: \`$(jq -r '.summary.unresolved_user_type_count' "${local_report}")\`"
            echo "- Modules without granular permission tree: \`$(jq -r '.summary.modules_without_granular_permission_tree_count' "${local_report}")\`"
            echo "- Mutating routes without module guard: \`$(jq -r '.summary.mutating_routes_without_module_guard_count' "${local_report}")\`"
            echo "- Mutating routes with module-only guard: \`$(jq -r '.summary.mutating_routes_with_module_only_guard_count' "${local_report}")\`"
            echo "- Critical findings: \`${critical_count}\`"
            echo "- Warnings: \`$(jq -r '.summary.warning_count' "${local_report}")\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Access Control production readiness audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: access-control-production-readiness-${{ github.sha }}
          path: access-control-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect Family final schema production audit
        id: family_final_schema_audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${GITHUB_WORKSPACE}/family-final-schema.json"
          remote_report="/tmp/clubos-family-final-schema-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan members:audit-family-final-schema --json --fail-on-finding --report-path='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          jq -e '
            .version == "family-final-schema-v1"
            and .read_only == true
            and .summary.ready == true
            and .summary.canonical_tables_present_count == .summary.canonical_tables_required_count
            and .summary.legacy_structures_present_count == 0
          ' "${local_report}" >/dev/null

          {
            echo '## Family final schema production audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Canonical tables: \`$(jq -r '.summary.canonical_tables_present_count' "${local_report}")/$(jq -r '.summary.canonical_tables_required_count' "${local_report}")\`"
            echo "- Legacy structures present: \`$(jq -r '.summary.legacy_structures_present_count' "${local_report}")\`"
            echo "- Ready: \`$(jq -r '.summary.ready' "${local_report}")\`"
            echo '- Audit is schema-only and contains no row-level data.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Family final schema production audit
        uses: actions/upload-artifact@v7
        with:
          name: family-final-schema-${{ github.sha }}
          path: family-final-schema.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect variant stock production readiness audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${GITHUB_WORKSPACE}/variant-stock-readiness.json"
          remote_report="/tmp/clubos-variant-stock-readiness-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan inventory:audit-variant-stock-readiness --json --report-path='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          jq -e '
            .version == "variant-stock-readiness-v1"
            and .read_only == true
            and .schema_detected.required_source_schema_present == true
            and .schema_detected.stock_movement_variant_column_present == true
            and .summary.known_direct_variant_stock_writer_count == 0
            and .interpretation.no_backfill_or_schema_change_performed == true
          ' "${local_report}" >/dev/null

          {
            echo '## Variant stock production readiness audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Variants: \`$(jq -r '.summary.variant_count' "${local_report}")\`"
            echo "- Tracked products with variants: \`$(jq -r '.summary.tracked_product_with_variants_count' "${local_report}")\`"
            echo "- Aggregate snapshot differences: \`$(jq -r '.summary.product_variant_aggregate_mismatch_count' "${local_report}")\`"
            echo "- Historical variant order items: \`$(jq -r '.summary.variant_order_item_count' "${local_report}")\`"
            echo "- Exactly attributable exits: \`$(jq -r '.summary.variant_order_item_exact_exit_count' "${local_report}")\`"
            echo "- Missing/duplicate/quantity-mismatch exits: \`$(jq -r '(.summary.variant_order_item_missing_exit_count|tostring) + "/" + (.summary.variant_order_item_duplicate_exit_count|tostring) + "/" + (.summary.variant_order_item_quantity_mismatch_count|tostring)' "${local_report}")\`"
            echo "- Invalid product/variant references: \`$(jq -r '.summary.invalid_product_variant_reference_count' "${local_report}")\`"
            echo "- Known direct variant stock writers: \`$(jq -r '.summary.known_direct_variant_stock_writer_count' "${local_report}")\`"
            echo '- Artifact contains aggregate counts only; no row or user identifiers.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload variant stock production readiness audit
        uses: actions/upload-artifact@v7
        with:
          name: variant-stock-production-readiness-${{ github.sha }}
          path: variant-stock-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect Store and Logistics production lifecycle readiness audit
        shell: bash
        run: |
          set -euo pipefail

          raw_report="${GITHUB_WORKSPACE}/store-logistics-lifecycle-raw.json"
          local_report="${GITHUB_WORKSPACE}/store-logistics-lifecycle-readiness.json"
          remote_report="/tmp/clubos-store-logistics-lifecycle-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan inventory:audit-store-logistics-stock --json --report-path='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${raw_report}"

          jq '{
            version,
            read_only,
            schema_detected,
            summary,
            interpretation
          }' "${raw_report}" > "${local_report}"
          rm -f "${raw_report}"

          jq -e '
            .version == "h5d-store-return-reversal-audit-v5"
            and .read_only == true
            and .schema_detected.tables.loja_encomendas == true
            and .schema_detected.tables.loja_encomenda_itens == true
            and .schema_detected.tables.invoice_items == true
            and .schema_detected.tables.invoices == true
            and .schema_detected.tables.payments == true
            and .schema_detected.tables.payment_allocations == true
            and .schema_detected.tables.payment_reversals == true
            and .schema_detected.tables.fiscal_document_requests == true
            and .schema_detected.tables.loja_encomenda_devolucoes == true
            and .schema_detected.tables.logistics_requests == true
            and .schema_detected.tables.logistics_request_items == true
            and .schema_detected.tables.products == true
            and .schema_detected.tables.product_variants == true
            and .schema_detected.tables.stock_movements == true
            and .schema_detected.store_order_fields.status == "estado"
            and .schema_detected.store_order_fields.invoice_id == "fatura_id"
            and .schema_detected.store_order_item_fields.product_column == "article_id"
            and .schema_detected.store_order_item_fields.variant_column == "product_variant_id"
            and .summary.total_store_orders_scanned >= 0
            and .summary.canonical_invoice_linked_count >= 0
            and .summary.legacy_without_invoice_count >= 0
            and .summary.missing_invoice_link_count >= 0
            and .summary.invalid_invoice_link_count >= 0
            and .summary.invoice_contract_mismatch_count >= 0
            and .summary.payment_projection_clean_count >= 0
            and .summary.payment_projection_mismatch_count >= 0
            and .summary.paid_fiscal_request_created_count >= 0
            and .summary.paid_fiscal_request_missing_count >= 0
            and .summary.premature_fiscal_request_count >= 0
            and .summary.fiscal_request_contract_mismatch_count >= 0
            and .summary.total_store_returns_scanned >= 0
            and .summary.store_returns_inconsistent_count >= 0
            and .summary.returned_stock_unbalanced_count >= 0
            and .summary.cancelled_stock_unbalanced_count >= 0
            and .summary.critical_count >= 0
            and .summary.warning_count >= 0
            and .interpretation.cancelled_order_is_balanced_when_exit_and_return_match == true
            and .interpretation.canonical_store_invoice_contract_active == true
            and .interpretation.store_financial_state_is_derived_from_invoice == true
            and .interpretation.paid_store_invoice_requires_manual_wintouch_request == true
            and .interpretation.delivered_return_requires_financial_and_fiscal_reversal_before_stock == true
            and .interpretation.payment_reversal_history_is_preserved == true
            and .interpretation.legacy_orders_without_invoice_are_reported_without_backfill == true
            and .interpretation.no_data_changed == true
          ' "${local_report}" >/dev/null

          {
            echo '## Store and Logistics production lifecycle readiness audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Store orders/items scanned: \`$(jq -r '.summary.total_store_orders_scanned' "${local_report}")/$(jq -r '.summary.total_store_order_items_scanned' "${local_report}")\`"
            echo "- Canonical invoices / legacy without invoice: \`$(jq -r '.summary.canonical_invoice_linked_count' "${local_report}")/$(jq -r '.summary.legacy_without_invoice_count' "${local_report}")\`"
            echo "- Missing/invalid/mismatched invoice links: \`$(jq -r '(.summary.missing_invoice_link_count|tostring) + "/" + (.summary.invalid_invoice_link_count|tostring) + "/" + (.summary.invoice_contract_mismatch_count|tostring)' "${local_report}")\`"
            echo "- Payment projection clean/mismatched: \`$(jq -r '(.summary.payment_projection_clean_count|tostring) + "/" + (.summary.payment_projection_mismatch_count|tostring)' "${local_report}")\`"
            echo "- Paid fiscal requests created/missing: \`$(jq -r '(.summary.paid_fiscal_request_created_count|tostring) + "/" + (.summary.paid_fiscal_request_missing_count|tostring)' "${local_report}")\`"
            echo "- Cancelled stock restored/unbalanced: \`$(jq -r '.summary.cancelled_stock_restored_count' "${local_report}")/$(jq -r '.summary.cancelled_stock_unbalanced_count' "${local_report}")\`"
            echo "- Store returns awaiting/completed/inconsistent: \`$(jq -r '(.summary.store_returns_awaiting_credit_note_count|tostring) + "/" + (.summary.store_returns_completed_clean_count|tostring) + "/" + (.summary.store_returns_inconsistent_count|tostring)' "${local_report}")\`"
            echo "- Returned stock restored/unbalanced: \`$(jq -r '.summary.returned_stock_restored_count' "${local_report}")/$(jq -r '.summary.returned_stock_unbalanced_count' "${local_report}")\`"
            echo "- Missing/duplicate physical exits: \`$(jq -r '.summary.missing_physical_exit_count' "${local_report}")/$(jq -r '.summary.duplicate_physical_exit_count' "${local_report}")\`"
            echo "- Critical/warning findings: \`$(jq -r '.summary.critical_count' "${local_report}")/$(jq -r '.summary.warning_count' "${local_report}")\`"
            echo '- Readiness is measured without mutating production; known debt is reported, not silently gated.'
            echo '- Artifact contains aggregate counts only; no row or user identifiers.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Store and Logistics production lifecycle readiness audit
        uses: actions/upload-artifact@v7
        with:
          name: store-logistics-lifecycle-readiness-${{ github.sha }}
          path: store-logistics-lifecycle-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect Internal Logistics production lifecycle readiness audit
        shell: bash
        run: |
          set -euo pipefail

          raw_report="${GITHUB_WORKSPACE}/internal-logistics-lifecycle-raw.json"
          local_report="${GITHUB_WORKSPACE}/internal-logistics-lifecycle-readiness.json"
          remote_report="/tmp/clubos-internal-logistics-lifecycle-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan inventory:audit-internal-logistics-lifecycle --json --report-path='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${raw_report}"

          jq '{version, read_only, schema_detected, summary, interpretation}' "${raw_report}" > "${local_report}"
          rm -f "${raw_report}"

          jq -e '
            .version == "h5e-internal-logistics-lifecycle-audit-v1"
            and .read_only == true
            and ([.schema_detected.tables[]] | all)
            and ([.schema_detected.product_capability_fields[]] | all)
            and ([.schema_detected.sports_request_source_fields[]] | all)
            and .summary.supplier_purchase_count >= 0
            and .summary.logistics_request_count >= 0
            and .summary.equipment_loan_count >= 0
            and .summary.sports_linked_request_count >= 0
            and .summary.supplier_purchase_missing_movement_count >= 0
            and .summary.supplier_purchase_legacy_financial_entry_count >= 0
            and .summary.invoiced_request_missing_invoice_count >= 0
            and .summary.financial_origin_mismatch_count >= 0
            and .summary.critical_count >= 0
            and .summary.warning_count >= 0
            and .summary.actionable_count >= 0
            and .interpretation.catalog_is_shared_with_store_and_configuration == true
            and .interpretation.stock_movements_is_the_only_stock_ledger == true
            and .interpretation.request_creation_does_not_move_stock == true
            and .interpretation.request_approval_reserves_and_delivery_exits_stock == true
            and .interpretation.equipment_loan_exit_and_return_use_stock_ledger == true
            and .interpretation.supplier_purchase_uses_movement_as_financial_boundary == true
            and .interpretation.supplier_purchase_financial_entry_is_legacy_read_only == true
            and .interpretation.sports_requests_keep_structured_source_identity == true
            and .interpretation.no_data_changed == true
          ' "${local_report}" >/dev/null

          {
            echo '## Internal Logistics production lifecycle readiness audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Purchases / requests / loans: \`$(jq -r '(.summary.supplier_purchase_count|tostring) + \"/\" + (.summary.logistics_request_count|tostring) + \"/\" + (.summary.equipment_loan_count|tostring)' "${local_report}")\`"
            echo "- Sports-linked requests: \`$(jq -r '.summary.sports_linked_request_count' "${local_report}")\`"
            echo "- Missing purchase movement / legacy financial entry: \`$(jq -r '(.summary.supplier_purchase_missing_movement_count|tostring) + \"/\" + (.summary.supplier_purchase_legacy_financial_entry_count|tostring)' "${local_report}")\`"
            echo "- Invoiced request missing invoice / financial origin mismatch: \`$(jq -r '(.summary.invoiced_request_missing_invoice_count|tostring) + \"/\" + (.summary.financial_origin_mismatch_count|tostring)' "${local_report}")\`"
            echo "- Critical / warning / actionable stock findings: \`$(jq -r '(.summary.critical_count|tostring) + \"/\" + (.summary.warning_count|tostring) + \"/\" + (.summary.actionable_count|tostring)' "${local_report}")\`"
            echo '- Read-only aggregate evidence; historical debt is measured without backfill.'
            echo '- Artifact contains aggregate counts only; no purchase, request, loan, product or user identifiers.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Internal Logistics production lifecycle readiness audit
        uses: actions/upload-artifact@v7
        with:
          name: internal-logistics-lifecycle-readiness-${{ github.sha }}
          path: internal-logistics-lifecycle-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect Fiscal production operational readiness audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${GITHUB_WORKSPACE}/fiscal-operational-readiness.json"
          remote_report="/tmp/clubos-fiscal-operational-readiness-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan finance:audit-fiscal-operational-readiness --json --report-path='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          jq -e '
            .version == "h4-fiscal-operational-readiness-v1"
            and .read_only == true
            and .contract.operation_mode == "manual_wintouch"
            and .contract.provider == "wintouch"
            and .contract.manual_contract_configured == true
            and .contract.automatic_provider_adapter_count == 0
            and .contract.automatic_issue_enabled == false
            and .schema_detected.required_schema_present == true
            and .route_contract.all_required_routes_present == true
            and .summary.critical_count == 0
            and .summary.ready == true
            and .interpretation.no_data_changed == true
          ' "${local_report}" >/dev/null

          {
            echo '## Fiscal production operational readiness audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Mode/provider: \`$(jq -r '.contract.operation_mode' "${local_report}")/$(jq -r '.contract.provider' "${local_report}")\`"
            echo "- Automatic adapters: \`$(jq -r '.contract.automatic_provider_adapter_count' "${local_report}")\`"
            echo "- Fiscal requests scanned: \`$(jq -r '.summary.total_fiscal_requests_scanned' "${local_report}")\`"
            echo "- Pending/issued: \`$(jq -r '.summary.pending_request_count' "${local_report}")/$(jq -r '.summary.issued_document_count' "${local_report}")\`"
            echo "- Critical findings: \`$(jq -r '.summary.critical_count' "${local_report}")\`"
            echo "- Warnings: \`$(jq -r '.summary.warning_count' "${local_report}")\`"
            echo "- Ready: \`$(jq -r '.summary.ready' "${local_report}")\`"
            echo '- Artifact contains aggregate counts only; no row or user identifiers.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Fiscal production operational readiness audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fiscal-production-operational-readiness-${{ github.sha }}
          path: fiscal-operational-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Gate Access Control critical findings
        if: steps.access_control_audit.outcome == 'success'
        shell: bash
        env:
          CRITICAL_COUNT: ${{ steps.access_control_audit.outputs.critical_count }}
        run: |
          set -euo pipefail

          if ! [[ "${CRITICAL_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Access Control critical_count: ${CRITICAL_COUNT}"
            exit 1
          fi

          if (( CRITICAL_COUNT > 0 )); then
            echo "::error::Access Control readiness audit reported ${CRITICAL_COUNT} critical finding(s)"
            exit 1
          fi

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## ClubOS production deploy'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Target: \`${VM_USER}@${VM_HOST}:${VM_APP_DIR}\`"
            echo '- Validation: CI, dependency security ratchets, TypeScript, lint, unit/component, multi-browser/mobile/accessibility E2E and PostgreSQL concurrency passed'
            echo '- SSH host identity: pinned known_hosts entry enforced'
            echo '- Desportivo legacy readiness audit: collected read-only from production'
            echo '- Access Control readiness audit: collected, artifact preserved and critical findings gated separately'
            echo '- Family final schema audit: canonical tables present and retired legacy structures physically absent'
            echo '- Store and Logistics lifecycle readiness: aggregate read-only evidence collected without gating known debt'
            echo '- Internal Logistics lifecycle readiness: purchases, requests, deliveries, loans and Sports/core contracts collected read-only'
            echo '- Fiscal operational readiness audit: manual Wintouch contract active, automatic provider disabled and critical findings gated'
            echo '- Result: successful'
          } >> "${GITHUB_STEP_SUMMARY}"
