name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_mysql, pdo_pgsql, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: php artisan test

      - name: Run legacy members read guard rail
        run: php artisan members:audit-users-legacy-read --fail-on-finding

  postgres-concurrency:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clubos_test
          POSTGRES_USER: clubos_test
          POSTGRES_PASSWORD: clubos_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_test -d clubos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: clubos_test
      DB_USERNAME: clubos_test
      DB_PASSWORD: clubos_test_ci_only
      DB_PROTECT_DESTRUCTIVE_COMMANDS: 'false'
      DB_ALLOW_DESTRUCTIVE_COMMANDS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare PostgreSQL schema
        run: php artisan migrate --force

      - name: Run PostgreSQL concurrency test
        run: php artisan test tests/Feature/Financeiro/PostgresMixedBankReconciliationConcurrencyTest.php

  deploy-production:
    name: Deploy production to Oracle VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - postgres-concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: clubos-production-deploy
      cancel-in-progress: false

    env:
      VM_USER: ${{ secrets.ORACLE_VM_USER || 'ubuntu' }}
      VM_HOST: ${{ secrets.ORACLE_VM_HOST || '129.159.13.211' }}
      VM_APP_DIR: ${{ secrets.ORACLE_VM_APP_DIR || '/var/www/clubmanager' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Configure SSH access
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${ORACLE_VM_SSH_KEY}" ]]; then
            echo "::error::Missing GitHub secret ORACLE_VM_SSH_KEY"
            exit 1
          fi

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_VM_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

          ssh-keygen -y -f "${HOME}/.ssh/id_ed25519" > /dev/null
          ssh-keyscan -H "${VM_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${VM_USER}@${VM_HOST}" \
            'echo SSH_OK'

      - name: Deploy main to production
        run: npm run deploy:vm

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## ClubOS production deploy'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Target: \`${VM_USER}@${VM_HOST}:${VM_APP_DIR}\`"
            echo '- Validation: CI and PostgreSQL concurrency passed'
            echo '- Result: successful'
          } >> "${GITHUB_STEP_SUMMARY}"
