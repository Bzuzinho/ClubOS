name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_mysql, pdo_pgsql, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Validate deployment and QA scripts
        run: |
          node --check bin/deploy-vm.mjs
          node --check scripts/qa/typecheck-ratchet.mjs
          node --check scripts/qa/npm-audit-ratchet.mjs
          bash -n bin/remote-deploy-backend.sh
          bash -n scripts/qa/composer-audit-ratchet.sh

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        run: bash scripts/qa/composer-audit-ratchet.sh

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: node scripts/qa/npm-audit-ratchet.mjs

      - name: TypeScript debt ratchet
        env:
          TYPECHECK_REPORT_PATH: typecheck-diagnostics.json
        run: npm run typecheck:ratchet

      - name: Upload H1.6 TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h1-6-typescript-diagnostics
          path: typecheck-diagnostics.json
          if-no-files-found: error
          retention-days: 1

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: php artisan test

      - name: Run legacy members read guard rail
        run: php artisan members:audit-users-legacy-read --fail-on-finding

  postgres-concurrency:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clubos_test
          POSTGRES_USER: clubos_test
          POSTGRES_PASSWORD: clubos_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_test -d clubos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: clubos_test
      DB_USERNAME: clubos_test
      DB_PASSWORD: clubos_test_ci_only
      DB_PROTECT_DESTRUCTIVE_COMMANDS: 'false'
      DB_ALLOW_DESTRUCTIVE_COMMANDS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare PostgreSQL schema
        run: php artisan migrate --force

      - name: Run PostgreSQL concurrency test
        run: php artisan test tests/Feature/Financeiro/PostgresMixedBankReconciliationConcurrencyTest.php

  deploy-production:
    name: Deploy production to Oracle VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - postgres-concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: clubos-production-deploy
      cancel-in-progress: false

    env:
      VM_USER: ${{ secrets.ORACLE_VM_USER }}
      VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      VM_APP_DIR: ${{ secrets.ORACLE_VM_APP_DIR }}
      VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Validate production deployment configuration
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          for variable in VM_USER VM_HOST VM_APP_DIR VM_KNOWN_HOSTS ORACLE_VM_SSH_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required production deployment secret/configuration: ${variable}"
              exit 1
            fi
          done

          if [[ "${VM_APP_DIR}" != /* ]]; then
            echo "::error::VM_APP_DIR must be an absolute path"
            exit 1
          fi

      - name: Configure SSH access
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_VM_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

          ssh-keygen -y -f "${HOME}/.ssh/id_ed25519" > /dev/null
          printf '%s\n' "${VM_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

          if ! ssh-keygen -F "${VM_HOST}" -f "${HOME}/.ssh/known_hosts" > /dev/null; then
            echo "::error::Pinned known_hosts does not contain an entry for ${VM_HOST}"
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            'echo SSH_OK'

      - name: Deploy main to production
        run: npm run deploy:vm

      - name: Collect Desportivo production legacy readiness audit
        id: sports_legacy_audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${RUNNER_TEMP}/desportivo-legacy-schema-data-readiness.json"
          remote_report="/tmp/clubos-desportivo-legacy-schema-data-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan desportivo:audit-legacy-schema-data --json='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          cat "${local_report}"
          echo "report_path=${local_report}" >> "${GITHUB_OUTPUT}"

      - name: Upload Desportivo production legacy readiness audit
        if: always() && steps.sports_legacy_audit.outputs.report_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: desportivo-production-legacy-readiness-${{ github.sha }}
          path: ${{ steps.sports_legacy_audit.outputs.report_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Gate Desportivo production legacy readiness
        shell: bash
        run: |
          set -euo pipefail

          report="${{ steps.sports_legacy_audit.outputs.report_path }}"
          if [[ -z "${report}" || ! -s "${report}" ]]; then
            echo "::error::Desportivo production legacy readiness report is missing"
            exit 1
          fi

          python3 - "${report}" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding='utf-8') as handle:
              data = json.load(handle)

          summary = data.get('summary') or {}
          not_ready = int(summary.get('not_ready_count', 0) or 0)
          mapped = int(summary.get('mapped_count', 0) or 0)
          manual_review = int(summary.get('manual_review_count', 0) or 0)
          forbidden_runtime = int(summary.get('forbidden_runtime_reference_count', 0) or 0)

          print(f"desportivo_not_ready_count={not_ready}")
          print(f"desportivo_mapped_count={mapped}")
          print(f"desportivo_manual_review_count={manual_review}")
          print(f"desportivo_forbidden_runtime_reference_count={forbidden_runtime}")

          if not_ready > 0 or forbidden_runtime > 0:
              raise SystemExit('Desportivo legacy readiness gate failed')
          PY

      - name: Collect Access Control production readiness audit
        id: access_control_audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${RUNNER_TEMP}/access-control-readiness.json"
          remote_report="/tmp/clubos-access-control-readiness-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan access-control:audit-readiness --json='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          cat "${local_report}"
          echo "report_path=${local_report}" >> "${GITHUB_OUTPUT}"

      - name: Upload Access Control production readiness audit
        if: always() && steps.access_control_audit.outputs.report_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: access-control-production-readiness-${{ github.sha }}
          path: ${{ steps.access_control_audit.outputs.report_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Gate Access Control production readiness
        shell: bash
        run: |
          set -euo pipefail

          report="${{ steps.access_control_audit.outputs.report_path }}"
          if [[ -z "${report}" || ! -s "${report}" ]]; then
            echo "::error::Access Control production readiness report is missing"
            exit 1
          fi

          python3 - "${report}" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding='utf-8') as handle:
              data = json.load(handle)

          summary = data.get('summary') or {}
          critical = int(summary.get('critical_count', 0) or 0)
          mutating_without_module_guard = int(summary.get('mutating_routes_without_module_guard_count', 0) or 0)
          unresolved_user_types = int(summary.get('unresolved_user_type_count', 0) or 0)

          print(f"critical_count={critical}")
          print(f"mutating_routes_without_module_guard_count={mutating_without_module_guard}")
          print(f"unresolved_user_type_count={unresolved_user_types}")

          if critical > 0 or mutating_without_module_guard > 0 or unresolved_user_types > 0:
              raise SystemExit('Access Control readiness gate failed')
          PY
