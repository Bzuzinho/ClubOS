name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_mysql, pdo_pgsql, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Validate deployment and QA scripts
        run: |
          node --check bin/deploy-vm.mjs
          node --check scripts/qa/typecheck-ratchet.mjs
          node --check scripts/qa/npm-audit-ratchet.mjs
          node --check scripts/qa/xlsx-import-contract.mjs
          node --check eslint.config.js
          bash -n bin/remote-deploy-backend.sh
          bash -n scripts/qa/composer-audit-ratchet.sh

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        run: bash scripts/qa/composer-audit-ratchet.sh

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: node scripts/qa/npm-audit-ratchet.mjs

      - name: Verify spreadsheet import contract
        run: node scripts/qa/xlsx-import-contract.mjs

      - name: TypeScript debt ratchet
        run: npm run typecheck:ratchet

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend unit/component tests
        run: npm run test:unit

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: php artisan test

      - name: Run legacy members read guard rail
        run: php artisan members:audit-users-legacy-read --fail-on-finding

  frontend-browser-qa:
    name: Frontend browser QA
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      DB_PROTECT_DESTRUCTIVE_COMMANDS: 'false'
      DB_ALLOW_DESTRUCTIVE_COMMANDS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare browser-test environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force

      - name: Build frontend for browser tests
        run: npm run build

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run multi-browser, mobile and accessibility E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  postgres-concurrency:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clubos_test
          POSTGRES_USER: clubos_test
          POSTGRES_PASSWORD: clubos_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_test -d clubos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: clubos_test
      DB_USERNAME: clubos_test
      DB_PASSWORD: clubos_test_ci_only
      DB_PROTECT_DESTRUCTIVE_COMMANDS: 'false'
      DB_ALLOW_DESTRUCTIVE_COMMANDS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare PostgreSQL schema
        run: php artisan migrate --force

      - name: Run PostgreSQL concurrency test
        run: php artisan test tests/Feature/Financeiro/PostgresMixedBankReconciliationConcurrencyTest.php

  deploy-production:
    name: Deploy production to Oracle VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - frontend-browser-qa
      - postgres-concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: clubos-production-deploy
      cancel-in-progress: false

    env:
      VM_USER: ${{ secrets.ORACLE_VM_USER }}
      VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      VM_APP_DIR: ${{ secrets.ORACLE_VM_APP_DIR }}
      VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Validate production deployment configuration
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          for variable in VM_USER VM_HOST VM_APP_DIR VM_KNOWN_HOSTS ORACLE_VM_SSH_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required production deployment secret/configuration: ${variable}"
              exit 1
            fi
          done

          if [[ "${VM_APP_DIR}" != /* ]]; then
            echo "::error::VM_APP_DIR must be an absolute path"
            exit 1
          fi

      - name: Configure SSH access
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${ORACLE_VM_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

          ssh-keygen -y -f "${HOME}/.ssh/id_ed25519" > /dev/null
          printf '%s\n' "${VM_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

          if ! ssh-keygen -F "${VM_HOST}" -f "${HOME}/.ssh/known_hosts" > /dev/null; then
            echo "::error::Pinned known_hosts does not contain an entry for ${VM_HOST}"
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            'echo SSH_OK'

      - name: Deploy main to production
        run: npm run deploy:vm

      - name: Collect Desportivo production legacy readiness audit
        id: sports_legacy_audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${RUNNER_TEMP}/desportivo-legacy-schema-data-readiness.json"
          remote_report="/tmp/clubos-desportivo-legacy-schema-data-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan desportivo:audit-legacy-schema-data --json='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          jq -e '.read_only == true and .version == "sports-legacy-schema-data-readiness-v1"' "${local_report}" >/dev/null
          cp "${local_report}" "${GITHUB_WORKSPACE}/desportivo-legacy-schema-data-readiness.json"

          {
            echo '## Desportivo production legacy readiness audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Read-only: \`$(jq -r '.read_only' "${local_report}")\`"
            echo "- Forbidden tables inventoried: \`$(jq -r '.summary.forbidden_table_count' "${local_report}")\`"
            echo "- Removal candidates: \`$(jq -r '.summary.removal_candidate_count' "${local_report}")\`"
            echo "- Candidates physically removed: \`$(jq -r '.summary.removal_complete_count' "${local_report}")\`"
            echo "- Candidates ready but still present: \`$(jq -r '.summary.removal_ready_count' "${local_report}")\`"
            echo "- Candidates blocked: \`$(jq -r '.summary.removal_blocked_count' "${local_report}")\`"
            echo "- Candidate rows requiring review: \`$(jq -r '.summary.candidate_rows_requiring_review' "${local_report}")\`"
            echo "- Unreconciled legacy presences: \`$(jq -r '.summary.presence_unreconciled_count' "${local_report}")\`"
            echo "- Legacy alias columns still present: \`$(jq -r '.summary.legacy_alias_columns_present' "${local_report}")\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Desportivo production legacy readiness audit
        uses: actions/upload-artifact@v7
        with:
          name: desportivo-production-legacy-readiness-${{ github.sha }}
          path: desportivo-legacy-schema-data-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect Access Control production readiness audit
        id: access_control_audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${RUNNER_TEMP}/access-control-readiness.json"
          remote_report="/tmp/clubos-access-control-readiness-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan access:audit-readiness --report-path='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          jq -e '.read_only == true and .contract == "access-control-readiness-v1"' "${local_report}" >/dev/null
          cp "${local_report}" "${GITHUB_WORKSPACE}/access-control-readiness.json"

          critical_count="$(jq -r '.summary.critical_count' "${local_report}")"

          if ! [[ "${critical_count}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Access Control critical_count: ${critical_count}"
            exit 1
          fi

          echo "critical_count=${critical_count}" >> "${GITHUB_OUTPUT}"

          {
            echo '## Access Control production readiness audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Read-only: \`$(jq -r '.read_only' "${local_report}")\`"
            echo "- Platform access users: \`$(jq -r '.summary.platform_access_user_count' "${local_report}")\`"
            echo "- Resolved UserTypes: \`$(jq -r '.summary.resolved_user_type_count' "${local_report}")\`"
            echo "- Unresolved UserTypes: \`$(jq -r '.summary.unresolved_user_type_count' "${local_report}")\`"
            echo "- Modules without granular permission tree: \`$(jq -r '.summary.modules_without_granular_permission_tree_count' "${local_report}")\`"
            echo "- Mutating routes without module guard: \`$(jq -r '.summary.mutating_routes_without_module_guard_count' "${local_report}")\`"
            echo "- Mutating routes with module-only guard: \`$(jq -r '.summary.mutating_routes_with_module_only_guard_count' "${local_report}")\`"
            echo "- Critical findings: \`${critical_count}\`"
            echo "- Warnings: \`$(jq -r '.summary.warning_count' "${local_report}")\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Access Control production readiness audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: access-control-production-readiness-${{ github.sha }}
          path: access-control-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect Family final schema production audit
        id: family_final_schema_audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${GITHUB_WORKSPACE}/family-final-schema.json"
          remote_report="/tmp/clubos-family-final-schema-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan members:audit-family-final-schema --json --fail-on-finding --report-path='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          jq -e '
            .version == "family-final-schema-v1"
            and .read_only == true
            and .summary.ready == true
            and .summary.canonical_tables_present_count == .summary.canonical_tables_required_count
            and .summary.legacy_structures_present_count == 0
          ' "${local_report}" >/dev/null

          {
            echo '## Family final schema production audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Canonical tables: \`$(jq -r '.summary.canonical_tables_present_count' "${local_report}")/$(jq -r '.summary.canonical_tables_required_count' "${local_report}")\`"
            echo "- Legacy structures present: \`$(jq -r '.summary.legacy_structures_present_count' "${local_report}")\`"
            echo "- Ready: \`$(jq -r '.summary.ready' "${local_report}")\`"
            echo '- Audit is schema-only and contains no row-level data.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Family final schema production audit
        uses: actions/upload-artifact@v7
        with:
          name: family-final-schema-${{ github.sha }}
          path: family-final-schema.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect variant stock production readiness audit
        shell: bash
        run: |
          set -euo pipefail

          local_report="${GITHUB_WORKSPACE}/variant-stock-readiness.json"
          remote_report="/tmp/clubos-variant-stock-readiness-${GITHUB_SHA}.json"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VM_USER}@${VM_HOST}" \
            "cd '${VM_APP_DIR}' && php artisan inventory:audit-variant-stock-readiness --json --report-path='${remote_report}' >/dev/null && cat '${remote_report}' && rm -f '${remote_report}'" \
            > "${local_report}"

          jq -e '
            .version == "variant-stock-readiness-v1"
            and .read_only == true
            and .schema_detected.required_source_schema_present == true
            and .schema_detected.stock_movement_variant_column_present == true
            and .summary.known_direct_variant_stock_writer_count == 0
            and .interpretation.no_backfill_or_schema_change_performed == true
          ' "${local_report}" >/dev/null

          {
            echo '## Variant stock production readiness audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Variants: \`$(jq -r '.summary.variant_count' "${local_report}")\`"
            echo "- Tracked products with variants: \`$(jq -r '.summary.tracked_product_with_variants_count' "${local_report}")\`"
            echo "- Aggregate snapshot differences: \`$(jq -r '.summary.product_variant_aggregate_mismatch_count' "${local_report}")\`"
            echo "- Historical variant order items: \`$(jq -r '.summary.variant_order_item_count' "${local_report}")\`"
            echo "- Exactly attributable exits: \`$(jq -r '.summary.variant_order_item_exact_exit_count' "${local_report}")\`"
            echo "- Missing/duplicate/quantity-mismatch exits: \`$(jq -r '(.summary.variant_order_item_missing_exit_count|tostring) + "/" + (.summary.variant_order_item_duplicate_exit_count|tostring) + "/" + (.summary.variant_order_item_quantity_mismatch_count|tostring)' "${local_report}")\`"
            echo "- Invalid product/variant references: \`$(jq -r '.summary.invalid_product_variant_reference_count' "${local_report}")\`"
            echo "- Known direct variant stock writers: \`$(jq -r '.summary.known_direct_variant_stock_writer_count' "${local_report}")\`"
            echo '- Artifact contains aggregate counts only; no row or user identifiers.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload variant stock production readiness audit
        uses: actions/upload-artifact@v7
        with:
          name: variant-stock-production-readiness-${{ github.sha }}
          path: variant-stock-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Gate Access Control critical findings
        if: steps.access_control_audit.outcome == 'success'
        shell: bash
        env:
          CRITICAL_COUNT: ${{ steps.access_control_audit.outputs.critical_count }}
        run: |
          set -euo pipefail

          if ! [[ "${CRITICAL_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Access Control critical_count: ${CRITICAL_COUNT}"
            exit 1
          fi

          if (( CRITICAL_COUNT > 0 )); then
            echo "::error::Access Control readiness audit reported ${CRITICAL_COUNT} critical finding(s)"
            exit 1
          fi

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## ClubOS production deploy'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Target: \`${VM_USER}@${VM_HOST}:${VM_APP_DIR}\`"
            echo '- Validation: CI, dependency security ratchets, TypeScript, lint, unit/component, multi-browser/mobile/accessibility E2E and PostgreSQL concurrency passed'
            echo '- SSH host identity: pinned known_hosts entry enforced'
            echo '- Desportivo legacy readiness audit: collected read-only from production'
            echo '- Access Control readiness audit: collected, artifact preserved and critical findings gated separately'
            echo '- Family final schema audit: canonical tables present and retired legacy structures physically absent'
            echo '- Result: successful'
          } >> "${GITHUB_STEP_SUMMARY}"
